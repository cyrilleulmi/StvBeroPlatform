name: Feature
description: A feature for the pipeline. Released for development with the label status:bereit.
title: "F-xx · "
labels: ["typ:feature"]
body:
  - type: markdown
    attributes:
      value: |
        The development agent implements this issue as soon as Cyrille sets the label `status:bereit`.
        The test agent checks exactly the acceptance criteria. The more concrete they are, the better the result.
        Help: [Backlog](../blob/main/docs/pipeline/backlog.md) · [Test data and scenarios](../blob/main/docs/test-data.md)
  - type: textarea
    id: ziel
    attributes:
      label: Goal
      description: One or two sentences. Who can do what afterwards?
    validations:
      required: true
  - type: input
    id: anforderungen
    attributes:
      label: Requirements
      description: IDs from docs/requirements/, e.g. ANM-01–ANM-12, RR-06
    validations:
      required: true
  - type: input
    id: voraussetzung
    attributes:
      # The German keyword «Voraussetzung» (prerequisite) stays: scripts/pipeline.sh and the status page look for it.
      label: Voraussetzung
      description: Prerequisite. Features that must be on main first, e.g. F-02, F-03
  - type: textarea
    id: kriterien
    attributes:
      label: Acceptance criteria
      description: Numbered. If possible with seed persons and scenarios from docs/test-data.md.
      placeholder: |
        1. Scenario S2: As `nina`, tap «dabei» on event 01 → Team 1 shows 6 dabei, 0 offen.
        2. …
    validations:
      required: true
  - type: textarea
    id: hinweise
    attributes:
      label: Notes and assumptions
      description: What else applies. What is not part of it.
