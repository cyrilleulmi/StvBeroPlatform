# Build and all tests on every PR (F-00, criterion 11).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-tests:
    name: Build und Tests  # check name stays German; kept in case a branch protection rule requires it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stv
          POSTGRES_PASSWORD: stv
          POSTGRES_DB: stv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          (cd frontend && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chrome)

      - name: All tests (scripts/test.sh)
        run: scripts/test.sh

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  container:
    name: Container image
    # Builds the image of the hosted test environments (E-83). Cloud sessions have no Docker, so this is
    # the check that the Dockerfile still works.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image (profile preview)
        run: docker build --build-arg PROFILE=preview -t stvbero:ci .
