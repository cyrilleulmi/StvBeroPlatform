# Build and all tests on every PR (F-00, criterion 11), split into parallel jobs (E-108, docs/architecture.md).
#
#   Changes    which parts a pull request touches (scripts/affected.mjs); a job nothing can affect is skipped
#   Backend    API contract, unit, REST and architecture tests, coverage gate
#   Frontend   lint with module boundaries and size limits, unit tests, build
#   E2E        Playwright on parallel stacks (scripts/e2e.sh). Pull requests: fast run (every test on mobile,
#              the @desktop tests on desktop). Pushes to develop and main: full run (every test on both).
#   Build und Tests   the one check that says whether all of the above passed
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: What does this change need?
        id: plan
        run: |
          node scripts/affected.mjs --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/affected.mjs --base "origin/${{ github.base_ref }}" --github-output | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # After a merge everything runs, whatever changed
            printf 'backend=true\nfrontend=true\ne2e=true\n' >> "$GITHUB_OUTPUT"
            echo "Push to ${{ github.ref_name }}: everything runs, E2E on both viewports." >> "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stv
          POSTGRES_PASSWORD: stv
          POSTGRES_DB: stv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Database without fsync
        # Throwaway data that every test resets: a third less time per reset
        run: |
          PGPASSWORD=stv psql -h localhost -U stv -d stv -q \
            -c "alter system set fsync = off" -c "alter system set synchronous_commit = off" \
            -c "alter system set full_page_writes = off" -c "select pg_reload_conf()"

      - name: API contract
        run: npx -y @redocly/cli@2.78.0 lint docs/api/openapi.yaml

      - name: Tests, architecture and coverage gate
        working-directory: backend
        run: mvn -B verify -Pcoverage

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, unit tests, build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stv
          POSTGRES_PASSWORD: stv
          POSTGRES_DB: stv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          (cd frontend && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chrome)

      - name: Database without fsync
        # Throwaway data that every test resets: a third less time per reset
        run: |
          PGPASSWORD=stv psql -h localhost -U stv -d stv -q \
            -c "alter system set fsync = off" -c "alter system set synchronous_commit = off" \
            -c "alter system set full_page_writes = off" -c "select pg_reload_conf()"

      - name: E2E tests (scripts/e2e.sh)
        run: scripts/e2e.sh ${{ github.event_name == 'push' && '--full' || '' }}

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            .local/e2e-backend-*.log
          retention-days: 7

  build-and-tests:
    name: Build und Tests  # check name stays German; kept in case a branch protection rule requires it
    needs: [changes, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were not needed
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::At least one job failed or was cancelled."
            exit 1
          fi

  container:
    name: Container image
    # Builds the image of the hosted test environments (E-91). Cloud sessions have no Docker, so this is
    # the check that the Dockerfile still works.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image (profile preview)
        run: docker build --build-arg PROFILE=preview -t stvbero:ci .

  deploy-test:
    name: Test environment
    # After a green run on develop: deploy the test environment on Fly.io (E-91, docs/deployment.md)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build-and-tests, container]
    uses: ./.github/workflows/deploy-test.yml
    secrets: inherit
