<h1>{{ texte.profil.titel }}</h1>

@if (anmeldung.ich(); as ich) {
  <section class="karte person" aria-labelledby="profil-name">
    <h2 id="profil-name">{{ ich.vorname }} {{ ich.nachname }}</h2>
    @if (ich.email) {
      <p class="nebentext">{{ ich.email }}</p>
    }
  </section>
}

<section class="karte">
  <fieldset class="umschalter" data-testid="theme-umschalter">
    <legend>{{ texte.profil.darstellung }}</legend>
    <div class="optionen">
      @for (o of optionen; track o.wert) {
        <!-- Jede Wahl zeigt sich in ihren eigenen Farben: data-theme gilt auch für ein einzelnes Element. -->
        <label class="option" [attr.data-theme]="o.vorschau">
          <input
            type="radio"
            name="darstellung"
            [value]="o.wert"
            [checked]="theme.modus() === o.wert"
            (change)="theme.setzen(o.wert)"
          />
          <span class="name">{{ o.text }}</span>
          <span class="farben" aria-hidden="true">
            <span class="farbe farbe-primary"></span>
            <span class="farbe farbe-coral"></span>
            <span class="farbe farbe-mustard"></span>
            <span class="farbe farbe-blue"></span>
          </span>
        </label>
      }
    </div>
  </fieldset>
</section>

@if (fehler(); as meldung) {
  <p class="meldung-fehler" role="alert">{{ meldung }}</p>
}

<button
  type="button"
  class="button button-sekundaer"
  [disabled]="abmeldend()"
  [attr.aria-busy]="abmeldend() ? 'true' : null"
  (click)="abmelden()"
>
  <app-icon name="log-out" [groesse]="20" />
  {{ texte.profil.abmelden }}
</button>
