<h1>{{ texts.profile.title }}</h1>

@if (auth.me(); as me) {
  <section class="karte person" aria-labelledby="profil-name">
    <h2 id="profil-name">{{ me.firstName }} {{ me.lastName }}</h2>
    @if (me.email) {
      <p class="nebentext">{{ me.email }}</p>
    }
  </section>
}

<section class="karte">
  <fieldset class="umschalter" data-testid="theme-umschalter">
    <legend>{{ texts.profile.theme }}</legend>
    <div class="optionen">
      @for (o of options; track o.value) {
        <!-- Jede Wahl zeigt sich in ihren eigenen Farben: data-theme gilt auch für ein einzelnes Element. -->
        <label class="option" [attr.data-theme]="o.preview">
          <input
            type="radio"
            name="darstellung"
            [value]="o.value"
            [checked]="theme.mode() === o.value"
            (change)="theme.set(o.value)"
          />
          <span class="name">{{ o.text }}</span>
          <span class="farben" aria-hidden="true">
            <span class="farbe farbe-primary"></span>
            <span class="farbe farbe-coral"></span>
            <span class="farbe farbe-mustard"></span>
            <span class="farbe farbe-blue"></span>
          </span>
        </label>
      }
    </div>
  </fieldset>
</section>

@if (error(); as message) {
  <p class="meldung-fehler" role="alert">{{ message }}</p>
}

<button
  type="button"
  class="button button-sekundaer"
  [disabled]="loggingOut()"
  [attr.aria-busy]="loggingOut() ? 'true' : null"
  (click)="logout()"
>
  <app-icon name="log-out" [size]="20" />
  {{ texts.profile.logout }}
</button>
