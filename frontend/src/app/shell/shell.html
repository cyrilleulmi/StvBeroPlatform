<div class="frame">
  <!-- Mobile: fixed header bar behind the bell, the content scrolls underneath (O-51) -->
  <div class="header-bar" aria-hidden="true"></div>
  <nav class="navigation" [attr.aria-label]="texts.navigation.name" data-testid="main-navigation">
    <p class="brand" aria-hidden="true">{{ texts.appName }}</p>
    <!-- Notifications: mobile as a bell at the top right, from 1024px as an entry above the list (F-06) -->
    <a
      class="bell"
      routerLink="/benachrichtigungen"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <app-icon name="bell" />
      <span class="bell-text">{{ texts.navigation.notifications }}</span>
      @if (unread() > 0) {
        <span class="counter" data-testid="notifications-counter">{{ unread() }}</span>
        <span class="visually-hidden">{{ texts.navigation.unread }}</span>
      }
    </a>
    <ul>
      @for (entry of entries(); track entry.route) {
        <li>
          <a
            [routerLink]="entry.route"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: entry.exact }"
          >
            <app-icon [name]="entry.icon" />
            <span>{{ entry.text }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
