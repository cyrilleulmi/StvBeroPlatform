<div class="rahmen">
  <!-- Mobil: feste Kopfzeile hinter der Glocke, der Inhalt scrollt darunter durch (O-51) -->
  <div class="kopfzeile" aria-hidden="true"></div>
  <nav class="navigation" [attr.aria-label]="texte.navigation.name" data-testid="hauptnavigation">
    <p class="marke" aria-hidden="true">{{ texte.appName }}</p>
    <!-- Benachrichtigungen: mobil als Glocke oben rechts, ab 1024px als Eintrag über der Liste (F-06) -->
    <a
      class="glocke"
      routerLink="/benachrichtigungen"
      routerLinkActive="aktiv"
      ariaCurrentWhenActive="page"
    >
      <app-icon name="bell" />
      <span class="glocke-text">{{ texte.navigation.benachrichtigungen }}</span>
      @if (ungelesen() > 0) {
        <span class="zaehler" data-testid="benachrichtigungen-zaehler">{{ ungelesen() }}</span>
        <span class="visuell-versteckt">{{ texte.navigation.ungelesen }}</span>
      }
    </a>
    <ul>
      @for (eintrag of eintraege(); track eintrag.route) {
        <li>
          <a
            [routerLink]="eintrag.route"
            routerLinkActive="aktiv"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: eintrag.exakt }"
          >
            <app-icon [name]="eintrag.icon" />
            <span>{{ eintrag.text }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
  <main class="inhalt">
    <router-outlet />
  </main>
</div>
