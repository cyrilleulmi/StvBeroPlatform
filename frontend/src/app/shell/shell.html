<div class="rahmen">
  <!-- Mobil: feste Kopfzeile hinter der Glocke, der Inhalt scrollt darunter durch (O-51) -->
  <div class="kopfzeile" aria-hidden="true"></div>
  <nav class="navigation" [attr.aria-label]="texts.navigation.name" data-testid="hauptnavigation">
    <p class="marke" aria-hidden="true">{{ texts.appName }}</p>
    <!-- Benachrichtigungen: mobil als Glocke oben rechts, ab 1024px als Eintrag über der Liste (F-06) -->
    <a
      class="glocke"
      routerLink="/benachrichtigungen"
      routerLinkActive="aktiv"
      ariaCurrentWhenActive="page"
    >
      <app-icon name="bell" />
      <span class="glocke-text">{{ texts.navigation.notifications }}</span>
      @if (unread() > 0) {
        <span class="zaehler" data-testid="benachrichtigungen-zaehler">{{ unread() }}</span>
        <span class="visuell-versteckt">{{ texts.navigation.unread }}</span>
      }
    </a>
    <ul>
      @for (entry of entries(); track entry.route) {
        <li>
          <a
            [routerLink]="entry.route"
            routerLinkActive="aktiv"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: entry.exact }"
          >
            <app-icon [name]="entry.icon" />
            <span>{{ entry.text }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
  <main class="inhalt">
    <router-outlet />
  </main>
</div>
