<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <title>STV Bero</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Plattform des Vereins: Termine, An- und Abmeldung, Teams." />
    <meta name="theme-color" content="#E9EDF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <script>
      // Apply the chosen theme before the first paint (no flash). See ThemeService.
      // Without a choice, and for unknown values (e.g. the former German «hell» or «duene»), Hell (E-98);
      // only «system» follows the device.
      try {
        var t = localStorage.getItem('stv-theme');
        if (t !== 'dark' && t !== 'system') t = 'light';
      } catch (e) {
        t = 'light';
      }
      if (t !== 'system') {
        document.documentElement.setAttribute('data-theme', t);
        var bar = t === 'dark' ? '#14181D' : '#E9EDF0';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', bar);
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Diese App braucht JavaScript.</noscript>
  </body>
</html>
