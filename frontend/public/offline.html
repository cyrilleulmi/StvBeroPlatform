<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · STV Bero</title>
    <style>
      :root { --bg: #f0f5f2; --surface: #ffffff; --text: #1f2a26; --muted: #56645e; --border: #dce6e0; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #18201d; --surface: #212b27; --text: #e7eeea; --muted: #a2b0aa; --border: #31403a; }
      }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 48px 20px; }
      h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 12px; }
      p { color: var(--muted); margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>Sobald du wieder online bist, lade die Seite neu.</p>
    </main>
  </body>
</html>
