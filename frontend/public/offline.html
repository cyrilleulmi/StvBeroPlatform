<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9EDF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)" />
    <title>Offline · STV Bero</title>
    <style>
      :root { --bg: #e9edf0; --surface: #ffffff; --text: #15202b; --muted: #4e5a66; --border: #c9d1d9; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #14181d; --surface: #1c2128; --text: #e3e7ec; --muted: #9ba4ae; --border: #353d47; color-scheme: dark; }
      }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Bahnschrift', 'Segoe UI', system-ui, sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 48px 20px; }
      h1 { font-family: 'Bahnschrift', 'DIN Condensed', 'Roboto Condensed', sans-serif; font-stretch: 80%; font-size: 34px; font-weight: 700; line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
      p { color: var(--muted); margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>Sobald du wieder online bist, lade die Seite neu.</p>
    </main>
  </body>
</html>
