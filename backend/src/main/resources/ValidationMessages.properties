# Deutsche Standardtexte für Bean Validation, damit die Oberfläche nie englische Meldungen zeigt.
# Wo ein Feld eine eigene Meldung braucht, steht sie direkt an der Annotation.
jakarta.validation.constraints.NotNull.message=Bitte angeben.
jakarta.validation.constraints.NotBlank.message=Bitte angeben.
jakarta.validation.constraints.NotEmpty.message=Bitte angeben.
jakarta.validation.constraints.Size.message=Erlaubt sind {min} bis {max} Zeichen bzw. Eintr\u00e4ge.
jakarta.validation.constraints.Min.message=Mindestens {value}.
jakarta.validation.constraints.Max.message=Höchstens {value}.
jakarta.validation.constraints.Pattern.message=Das Format stimmt nicht.
jakarta.validation.constraints.Email.message=Bitte eine gültige E-Mail-Adresse angeben.
jakarta.validation.constraints.Positive.message=Bitte eine Zahl grösser als 0 angeben.
jakarta.validation.constraints.PositiveOrZero.message=Bitte 0 oder eine grössere Zahl angeben.
