# Database: locally via scripts/db-start.sh (no Docker in the cloud)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${STV_DB_USER:stv}
quarkus.datasource.password=${STV_DB_PASSWORD:stv}
quarkus.datasource.jdbc.url=${STV_DB_URL:jdbc:postgresql://localhost:5432/stv}
quarkus.datasource.devservices.enabled=false

# Schema only via Flyway (NF-24)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.http.port=8080
quarkus.http.test-port=8081

# OpenAPI: generated specification under /q/openapi, compared with docs/api/openapi.yaml in the test
quarkus.smallrye-openapi.info-title=StvBeroPlatform API
quarkus.swagger-ui.always-include=true

# Test support (/api/test/*, seed, fixed clock) only in dev and test.
# Build property: in profile prod the resources are not registered at all.
stv.test-support=false
%dev.stv.test-support=true
%test.stv.test-support=true

# Session cookie: in prod only over HTTPS
stv.session.cookie-secure=true
%dev.stv.session.cookie-secure=false
%test.stv.session.cookie-secure=false

%dev.quarkus.console.enabled=false
%dev.quarkus.live-reload.instrumentation=false

# Reminders (BEN-01): in tests only via the test clock endpoint, so that nothing runs in between by chance
%test.quarkus.scheduler.enabled=false

# swiss unihockey (F-07, SUH). In dev/test the simulator replaces the API (stv.test-support=true).
# According to public clients, api-v2 now requires credentials; https://wc.swissunihockey.ch is open
# (same response format, paths without /api). See docs/open-points.md, O-20 and O-24.
stv.swiss-unihockey.url=${STV_SU_URL:https://api-v2.swissunihockey.ch/api}
stv.swiss-unihockey.timeout=PT20S
# Daily sync (SUH-03), Swiss time
stv.swiss-unihockey.sync.cron=${STV_SU_CRON:0 30 4 * * ?}

# Address of the app, for the links to the events in the calendar feed (F-18, CAL-03)
stv.app-url=${STV_APP_URL:http://localhost:4200}
