# Database: locally via scripts/db-start.sh (no Docker in the cloud)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${STV_DB_USER:stv}
quarkus.datasource.password=${STV_DB_PASSWORD:stv}
quarkus.datasource.jdbc.url=${STV_DB_URL:jdbc:postgresql://localhost:5432/stv}
quarkus.datasource.devservices.enabled=false

# Schema only via Flyway (NF-24)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.http.port=8080
quarkus.http.test-port=8081

# OpenAPI: generated specification under /q/openapi, compared with docs/api/openapi.yaml in the test
quarkus.smallrye-openapi.info-title=StvBeroPlatform API
quarkus.swagger-ui.always-include=true

# Test support (/api/test/*, seed, fixed clock) only in dev and test.
# Build property: in profile prod the resources are not registered at all.
stv.test-support=false
%dev.stv.test-support=true
%test.stv.test-support=true

# Session cookie: in prod only over HTTPS
stv.session.cookie-secure=true
%dev.stv.session.cookie-secure=false
%test.stv.session.cookie-secure=false

%dev.quarkus.console.enabled=false
%dev.quarkus.live-reload.instrumentation=false

# Reminders (BEN-01): in tests only via the test clock endpoint, so that nothing runs in between by chance
%test.quarkus.scheduler.enabled=false

# Simulators instead of the outside world (swiss unihockey, routing). Production never simulates. With test
# support there are two data sets, switched at runtime with POST /api/test/reset?dataset=club|test:
#   test: fixed seed of docs/test-data.md with simulators (all automated tests)
#   club: the club with its real teams, live data from swiss unihockey and real routes (default in dev)
# STV_SIMULATION=true starts dev with the test data set.
stv.simulation=false
%dev.stv.simulation=${STV_SIMULATION:false}
%test.stv.simulation=true

# swiss unihockey (F-07, SUH). https://wc.swissunihockey.ch is the free interface of the official web
# components; api-v2 answers 401 without partner credentials (checked live on 21.11.2026, E-83, O-20).
stv.swiss-unihockey.url=${STV_SU_URL:https://wc.swissunihockey.ch}
stv.swiss-unihockey.timeout=PT20S
# Club at swiss unihockey, for the teams in the link dialog (SUH-02): Eintracht Beromünster
stv.swiss-unihockey.club-id=${STV_SU_CLUB_ID:417058}
# Cache for the responses (SUH-14): off in production; in dev every restart loads the club data, and the free
# interface should not be asked each time
stv.swiss-unihockey.cache-dir=${STV_SU_CACHE_DIR:}
%dev.stv.swiss-unihockey.cache-dir=${STV_SU_CACHE_DIR:../.local/su-cache}
stv.swiss-unihockey.cache-ttl=${STV_SU_CACHE_TTL:PT1H}
# Daily sync (SUH-03), Swiss time
stv.swiss-unihockey.sync.cron=${STV_SU_CRON:0 30 4 * * ?}

# Address of the app, for the links to the events in the calendar feed (F-18, CAL-03)
stv.app-url=${STV_APP_URL:http://localhost:4200}

# Notifications by e-mail and push (F-19, BEN-10). Configuration for production: docs/requirements/08-notifications.md.
# Without configuration the channel is off and the app runs normally. In dev/test the simulator replaces SMTP and
# the push services (stv.test-support=true): nothing goes out, everything is recorded (GET /api/test/notifications).
# E-mail: on only if STV_SMTP_HOST and STV_MAIL_FROM are set
stv.email.from=${STV_MAIL_FROM:}
stv.email.smtp-host=${STV_SMTP_HOST:}
quarkus.mailer.from=${STV_MAIL_FROM:noreply@localhost}
quarkus.mailer.host=${STV_SMTP_HOST:localhost}
quarkus.mailer.port=${STV_SMTP_PORT:587}
quarkus.mailer.username=${STV_SMTP_USER:}
quarkus.mailer.password=${STV_SMTP_PASSWORD:}
# STARTTLS on port 587 (default); for implicit TLS on port 465: STV_SMTP_TLS=true and STV_SMTP_STARTTLS=DISABLED
quarkus.mailer.start-tls=${STV_SMTP_STARTTLS:REQUIRED}
quarkus.mailer.tls=${STV_SMTP_TLS:false}
# Push (Web Push, VAPID): on only if all three are set. Keys as base64url (e.g. npx web-push generate-vapid-keys)
stv.push.vapid-public-key=${STV_VAPID_PUBLIC_KEY:}
stv.push.vapid-private-key=${STV_VAPID_PRIVATE_KEY:}
stv.push.vapid-subject=${STV_VAPID_SUBJECT:}

# Route for the driver list and the timeline (F-20, DRV-06, DRV-15). The first service that is configured is
# used: Google Maps (Routes API, needs a key with a billing account), OpenRouteService (free key), otherwise
# OpenStreetMap without a key (Nominatim for the places, OSRM for the route). While the app simulates, the
# routing simulator replaces them.
stv.routing.google.url=${STV_GOOGLE_ROUTES_URL:https://routes.googleapis.com}
stv.routing.google.api-key=${STV_GOOGLE_MAPS_API_KEY:}
stv.routing.url=${STV_ORS_URL:https://api.openrouteservice.org}
stv.routing.api-key=${STV_ORS_API_KEY:}
stv.routing.osm.geocoder-url=${STV_NOMINATIM_URL:https://nominatim.openstreetmap.org}
stv.routing.osm.router-url=${STV_OSRM_URL:https://router.project-osrm.org}
# Name the app gives the OpenStreetMap services (their usage policy asks for an identifying user agent)
stv.routing.user-agent=${STV_ROUTING_USER_AGENT:club-platform}
stv.routing.timeout=PT10S
