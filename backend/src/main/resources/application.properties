# Datenbank: lokal über scripts/db-start.sh (kein Docker in der Cloud)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${STV_DB_USER:stv}
quarkus.datasource.password=${STV_DB_PASSWORD:stv}
quarkus.datasource.jdbc.url=${STV_DB_URL:jdbc:postgresql://localhost:5432/stv}
quarkus.datasource.devservices.enabled=false

# Schema nur über Flyway (NF-24)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.http.port=8080
quarkus.http.test-port=8081

# OpenAPI: erzeugte Spezifikation unter /q/openapi, Vergleich mit docs/api/openapi.yaml im Test
quarkus.smallrye-openapi.info-title=StvBeroPlatform API
quarkus.swagger-ui.always-include=true

# Test-Hilfen (/api/test/*, Seed, feste Uhr) nur in dev und test.
# Build-Eigenschaft: Im Profil prod werden die Ressourcen gar nicht registriert.
stv.testhilfen=false
%dev.stv.testhilfen=true
%test.stv.testhilfen=true

# Sitzungs-Cookie: in prod nur über HTTPS
stv.sitzung.cookie-secure=true
%dev.stv.sitzung.cookie-secure=false
%test.stv.sitzung.cookie-secure=false

%dev.quarkus.console.enabled=false
%dev.quarkus.live-reload.instrumentation=false

# Erinnerungen (BEN-01): in Tests nur über die Test-Hilfe Uhr, damit nichts zufällig dazwischenläuft
%test.quarkus.scheduler.enabled=false

# swiss unihockey (F-07, SUH). In dev/test ersetzt der Simulator die Schnittstelle (stv.testhilfen=true).
# api-v2 verlangt laut öffentlichen Clients inzwischen Zugangsdaten; frei ist https://wc.swissunihockey.ch
# (gleiches Antwortformat, Pfade ohne /api). Siehe docs/offene-punkte.md, O-20 und O-24.
stv.swiss-unihockey.url=${STV_SU_URL:https://api-v2.swissunihockey.ch/api}
stv.swiss-unihockey.zeitlimit=PT20S
# Täglicher Abgleich (SUH-03), Schweizer Zeit
stv.swiss-unihockey.abgleich.cron=${STV_SU_CRON:0 30 4 * * ?}
