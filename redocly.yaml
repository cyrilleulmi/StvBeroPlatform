# Lint rules for the API contract: npx @redocly/cli lint docs/api/openapi.yaml
# Goal: 0 errors, 0 warnings.
extends:
  - recommended
rules:
  # A local server is intended; a production host is still open (O-02).
  no-server-example.com: off
  # The test endpoints (tag «Test») deliberately have no error responses.
  # All domain endpoints have 4xx responses; the review agent checks this.
  operation-4xx-response: off
