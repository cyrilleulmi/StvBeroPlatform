# Prüfregeln für den API-Vertrag: npx @redocly/cli lint docs/api/openapi.yaml
# Ziel: 0 Fehler, 0 Warnungen.
extends:
  - recommended
rules:
  # Lokaler Server ist gewollt, ein produktiver Host ist noch offen (O-02).
  no-server-example.com: off
  # Die Test-Endpunkte (Tag «Test») haben bewusst keine Fehlerantworten.
  # Alle fachlichen Endpunkte haben 4xx-Antworten; der Review-Agent prüft das.
  operation-4xx-response: off
