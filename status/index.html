<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StvBero Pipeline · Status</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F0F5F2; --surface: #FFFFFF; --text: #1F2A26; --muted: #56645E; --border: #DCE6E0;
  --primary: #2C7F69; --on-primary: #FFFFFF; --primary-soft: #D7EEE6;
  --coral: #B8503A; --coral-soft: #FCE4DD;
  --mustard: #6E6400; --mustard-soft: #F1EFC4;
  --blue: #2F6C9A; --blue-soft: #DCEBF6;
  --radius-card: 22px; --radius-tile: 18px; --radius-icon: 12px; --radius-pill: 999px;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18201D; --surface: #212B27; --text: #E7EEEA; --muted: #A2B0AA; --border: #31403A;
    --primary: #6FD0B4; --on-primary: #0E2620; --primary-soft: #224238;
    --coral: #F3A493; --coral-soft: #48302C;
    --mustard: #E3D97A; --mustard-soft: #3E3B22;
    --blue: #8EC3EC; --blue-soft: #233848;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
a { color: var(--primary); font-weight: 600; text-decoration: none; }
a:hover { text-decoration: underline; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px; margin-bottom: 14px; }
.card.alarm { border-color: var(--coral); background: var(--coral-soft); }
.row { display: flex; gap: 10px; align-items: flex-start; }
.row + .row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.icon { flex: 0 0 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: 13px; }
.icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon.coral { background: var(--coral-soft); color: var(--coral); } .icon.mustard { background: var(--mustard-soft); color: var(--mustard); } .icon.blue { background: var(--blue-soft); color: var(--blue); } .icon.muted { background: var(--bg); color: var(--muted); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; gap: 8px; }
.heading { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.brand .logo svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 700; }
.meta { color: var(--muted); font-size: 13px; }
.btn { font: 700 14px var(--font); border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 0 16px; min-height: 44px; cursor: pointer; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); padding: 3px; margin-bottom: 14px; flex-wrap: wrap; }
.seg button { font: 600 13px var(--font); border: 0; background: none; color: var(--muted); border-radius: var(--radius-pill); padding: 0 12px; min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: var(--radius-tile); border: 1px solid var(--border); background: var(--surface); padding: 10px 14px; min-width: 120px; flex: 1; }
.chip b { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.chip span { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.chip.coral b { color: var(--coral); } .chip.primary b { color: var(--primary); } .chip.mustard b { color: var(--mustard); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: var(--radius-pill); padding: 2px 9px; background: var(--primary-soft); color: var(--primary); white-space: nowrap; }
.tag.coral { background: var(--coral-soft); color: var(--coral); } .tag.mustard { background: var(--mustard-soft); color: var(--mustard); } .tag.blue { background: var(--blue-soft); color: var(--blue); } .tag.muted { background: var(--bg); color: var(--muted); }
.new { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); margin-right: 6px; vertical-align: middle; }
.day { font-weight: 700; font-size: 13px; color: var(--muted); margin: 18px 0 8px 4px; }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 13px; }
.body { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 6px; max-height: 420px; overflow: auto; }
.empty { color: var(--muted); }
.error { color: var(--coral); font-weight: 600; }
label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin: 0 0 10px 4px; }
.flow { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.flow span { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); background: var(--bg); color: var(--muted); }
.flow span.on { background: var(--primary); color: var(--on-primary); }
.flow span.done { background: var(--primary-soft); color: var(--primary); }
.flow span.bad { background: var(--coral); color: #fff; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg></div>
      <div>
        <h1>StvBero Pipeline</h1>
        <div class="sub" id="state">Lädt …</div>
      </div>
    </div>
    <div class="btns">
      <button class="btn" id="reload" type="button" data-testid="reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Aktualisieren</button>
      <button class="btn primary" id="mark-read" type="button" data-testid="mark-read"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>Alles gelesen</button>
    </div>
  </header>

  <section id="alarm" aria-label="Braucht dich"></section>

  <section class="card" aria-labelledby="h-now">
    <h2 id="h-now">Gerade in Arbeit</h2>
    <div id="now"><p class="empty">Lädt …</p></div>
  </section>

  <section aria-labelledby="h-since">
    <h2 id="h-since" style="margin-left:4px">Was passiert ist</h2>
    <div class="seg" role="group" aria-label="Zeitraum">
      <button type="button" data-range="visit" aria-pressed="true">Seit letztem Besuch</button>
      <button type="button" data-range="24h" aria-pressed="false">24 Stunden</button>
      <button type="button" data-range="7d" aria-pressed="false">7 Tage</button>
    </div>
    <div class="chips" id="numbers"></div>
    <label class="toggle"><input type="checkbox" id="all"> auch Starts und Zwischenschritte zeigen</label>
    <div id="history"></div>
  </section>

  <section class="card" aria-labelledby="h-queue" style="margin-top:14px">
    <h2 id="h-queue">Warteschlange</h2>
    <div id="queue"><p class="empty">Lädt …</p></div>
  </section>

  <p class="meta" style="margin:20px 4px 0">Live aus GitHub (<a href="https://github.com/cyrilleulmi/StvBeroPlatform">cyrilleulmi/StvBeroPlatform</a>). «Letzter Besuch» wird pro Gerät im Browser gespeichert. Aktualisiert sich alle 5 Minuten.</p>
</main>

<script>
(() => {
  const REPO = 'cyrilleulmi/StvBeroPlatform';
  const API = 'https://api.github.com/repos/' + REPO;
  const AGENT = 'cyrilleulmi';   // The agents write under this account; content by others is hidden.
  const STAGES = ['Entwicklung', 'Review', 'Test', 'Gemergt'];
  const $ = id => document.getElementById(id);

  // Line icons (Lucide, ISC license)
  const PATHS = {
    warning: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
    active: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
    review: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    test: '<path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/>',
    watchdog: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
    merge: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
    new: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/>',
    start: '<path d="M6 3l14 9-14 9V3z"/>',
    comment: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    back: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  };
  const ic = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${PATHS[name]}</svg>`;
  // Remove emojis from agent texts; check marks and crosses in tables stay readable as text characters.
  const withoutEmoji = s => String(s ?? '').replace(/✅|✔️|✔/g, '✓').replace(/❌|✖️/g, '✗')
    .replace(/\p{Extended_Pictographic}️?/gu, '').replace(/[ \t]{2,}/g, ' ').replace(/ ·\s*$/,'').trim();

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    sget(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    sset(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
  };
  // Storage keys. The old German keys (before F-11) are still read once, so the last visit is not lost.
  const KEY_VISIT = 'stvbero.visit', OLD_KEY_VISIT = 'stvbero.besuch';
  const KEY_LAST_VISIT = 'stvbero.lastVisit', OLD_KEY_LAST_VISIT = 'stvbero.letzterBesuch';
  const KEY_DATA = 'stvbero.data', OLD_KEY_DATA = 'stvbero.daten';

  // «Seit letztem Besuch»: the state before this visit applies to the whole session (also after reloading in the same tab).
  const now = Date.now();
  let visit = Number(store.sget(KEY_VISIT) || store.sget(OLD_KEY_VISIT) || store.get(KEY_LAST_VISIT) || store.get(OLD_KEY_LAST_VISIT) || (now - 86400000));
  store.sset(KEY_VISIT, String(visit));
  store.set(KEY_LAST_VISIT, String(now));

  let range = 'visit';
  let data = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const time = t => new Date(t).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
  const day = t => {
    const d = new Date(t), h = new Date(); h.setHours(0, 0, 0, 0);
    const diff = Math.round((h - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
    if (diff === 0) return 'Heute';
    if (diff === 1) return 'Gestern';
    return d.toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' });
  };
  const ago = t => {
    const m = Math.round((Date.now() - new Date(t)) / 60000);
    if (m < 1) return 'gerade eben';
    if (m < 60) return 'vor ' + m + ' Min.';
    const h = Math.floor(m / 60);
    if (h < 24) return 'vor ' + h + ' Std.' + (m % 60 && h < 3 ? ' ' + (m % 60) + ' Min.' : '');
    return 'vor ' + Math.round(h / 24) + ' Tagen';
  };
  const labels = it => (it.labels || []).map(l => l.name);
  const link = it => `<a href="${esc(it.html_url)}">#${it.number}</a>`;

  async function fetchJson(path) {
    const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 403 || r.status === 429) {
      const reset = Number(r.headers.get('x-ratelimit-reset')) * 1000;
      throw new Error('GitHub-Abfragelimit erreicht' + (reset ? ', wieder möglich um ' + time(reset) : '') + '.');
    }
    if (!r.ok) throw new Error('GitHub antwortet mit ' + r.status + '.');
    return r.json();
  }

  async function load() {
    $('state').textContent = 'Lädt …';
    try {
      const since = new Date(Math.min(visit, Date.now() - 7 * 86400000)).toISOString();
      const [items, comments, events] = await Promise.all([
        fetchJson('/issues?state=all&sort=updated&direction=desc&per_page=100'),
        fetchJson('/issues/comments?sort=created&direction=desc&per_page=100&since=' + encodeURIComponent(since)),
        fetchJson('/issues/events?per_page=100'),
      ]);
      data = { items, comments: comments.filter(k => k.user && k.user.login === AGENT), events, loaded: Date.now() };
      store.set(KEY_DATA, JSON.stringify(data));
      render();
    } catch (e) {
      const cached = store.get(KEY_DATA);
      if (cached && !data) { data = JSON.parse(cached); render(); }
      else if (!data && store.get(OLD_KEY_DATA)) { data = fromOldData(JSON.parse(store.get(OLD_KEY_DATA))); render(); }
      $('state').innerHTML = `<span class="error">${esc(e.message)}</span>` + (data ? ' Angezeigt wird der Stand von ' + time(data.loaded) + '.' : '');
    }
  }

  // Cached data saved before F-11 used German field names.
  function fromOldData(old) {
    return { items: old.items || [], comments: old.kommentare || [], events: old.ereignisse || [], loaded: old.geladen };
  }

  function itemNo(url) { return Number(String(url).split('/').pop()); }

  // Classifies an agent comment
  function classify(k) {
    const b = k.body || '';
    const heading = (b.match(/^##\s+(.+)$/m) || [])[1] || '';
    const firstLine = b.replace(/<!--[\s\S]*?-->/g, '').trim().split('\n')[0].replace(/^#+\s*/, '');
    if (/<!-- pipeline:anspruch/.test(b)) return null;
    const kind = (b.match(/<!-- pipeline:([a-z-]+)/) || [])[1] || '';
    const blocked = /blockiert|⛔/i.test(heading);
    const back = /🔁|nacharbeit/i.test(heading);
    // English comments since F-09 («✅ merged», «started», «claimed»); the German words match comments written before (O-54).
    const merged = /gemergt|✅\s*merged/i.test(heading);
    let important = ['entwicklung', 'review', 'test', 'waechter'].includes(kind) && !!heading;
    if (/startet|gestartet|beansprucht|started|claimed/i.test(firstLine) && !heading) important = false;
    if (!kind && !/startet|gestartet|started/i.test(firstLine)) important = true; // show free comments (e.g. questions, findings)
    let tone = 'primary', icon = 'comment';
    if (kind === 'entwicklung') icon = 'code';
    if (kind === 'review') icon = 'review';
    if (kind === 'test') icon = 'test';
    if (kind === 'waechter') icon = 'watchdog';
    if (back) { tone = 'mustard'; }
    if (merged) { icon = 'merge'; }
    if (blocked) { tone = 'coral'; icon = 'warning'; }
    if (!important) { tone = 'muted'; icon = 'start'; }
    // «Test · Round 0 · 🔁 rework» → title «Test · Round 0», tag «Rework»
    let title = heading || firstLine || 'Kommentar', status = '';
    const parts = title.split(' · ');
    if (heading && parts.length > 1 && /\p{Extended_Pictographic}|✅/u.test(parts[parts.length - 1])) status = withoutEmoji(parts.pop());
    title = withoutEmoji(parts.join(' · '));
    status = status.replace(/^[✓✗]\s*/, '');
    if (status) status = status.charAt(0).toUpperCase() + status.slice(1);
    return { time: k.created_at, no: itemNo(k.issue_url), title, status, text: withoutEmoji(b.replace(/<!--[\s\S]*?-->/g, '').trim()), url: k.html_url, tone, icon, important, merged, back, blocked };
  }

  function render() {
    if (!data) return;
    const from = range === 'visit' ? visit : Date.now() - (range === '24h' ? 86400000 : 7 * 86400000);
    const byNo = Object.fromEntries(data.items.map(i => [i.number, i]));
    const open = data.items.filter(i => i.state === 'open');

    $('state').textContent = 'Stand ' + time(data.loaded) + ' · letzter Besuch ' + (visit ? day(visit).toLowerCase().replace(/^(heute|gestern)$/, m => m) + ' ' + time(visit) : '–');

    // Needs you
    const blocked = open.filter(i => labels(i).includes('pipeline:blockiert'));
    const release = open.filter(i => labels(i).includes('typ:nachbesserung') && !labels(i).includes('status:bereit') && !labels(i).includes('status:in-arbeit'));
    let alarm = '';
    if (blocked.length || release.length) {
      alarm = '<div class="card alarm"><h2 style="color:var(--coral)">Braucht dich</h2>';
      for (const i of blocked) {
        const last = data.comments.filter(k => itemNo(k.issue_url) === i.number)[0];
        alarm += `<div class="row"><div class="icon coral">${ic('warning')}</div><div class="grow"><div class="title">${esc(i.title)} ${link(i)}</div><div class="meta">Blockiert: die Pipeline wartet auf deinen Entscheid.${last ? ' Letzter Kommentar ' + ago(last.created_at) + '.' : ''}</div></div></div>`;
      }
      for (const i of release) {
        alarm += `<div class="row"><div class="icon mustard">${ic('flag')}</div><div class="grow"><div class="title">${esc(i.title)} ${link(i)}</div><div class="meta">Nachbesserung ohne Freigabe. Mit Label <b>status:bereit</b> wird sie automatisch umgesetzt.</div></div></div>`;
      }
      alarm += '</div>';
    }
    $('alarm').innerHTML = alarm;

    // In progress
    const prs = open.filter(i => i.pull_request && labels(i).some(l => l.startsWith('pipeline:')));
    const inProgress = open.filter(i => !i.pull_request && labels(i).includes('status:in-arbeit') && !prs.some(p => p.title === i.title));
    let nowHtml = '';
    for (const p of prs) {
      const l = labels(p);
      const stage = l.includes('pipeline:test') ? 2 : l.includes('pipeline:review') ? 1 : 0;
      const rework = l.includes('pipeline:nacharbeit');
      const active = l.includes('agent:aktiv');
      const k = data.comments.filter(c => itemNo(c.issue_url) === p.number);
      const round = Math.max(0, k.filter(c => /<!-- pipeline:entwicklung -->/.test(c.body)).length - (rework ? 0 : 1));
      const who = rework ? 'Nacharbeit' : STAGES[stage];
      const condition = active ? `${who}: Agent arbeitet` : `${who}: wartet auf den Agenten`;
      const flow = STAGES.map((s, x) => `<span class="${l.includes('pipeline:blockiert') && x === stage ? 'bad' : x < stage ? 'done' : x === stage ? 'on' : ''}">${x === 0 && rework ? 'Nacharbeit' : s}</span>`).join('');
      nowHtml += `<div class="row"><div class="icon ${rework ? 'mustard' : 'blue'}">${ic(active ? 'active' : 'clock')}</div><div class="grow"><div class="title">${esc(p.title)} ${link(p)}</div><div class="meta">${esc(condition)} · Runde ${round}${k[0] ? ' · letzte Meldung ' + ago(k[0].created_at) : ''}</div><div class="flow">${flow}</div></div></div>`;
    }
    for (const i of inProgress) {
      nowHtml += `<div class="row"><div class="icon blue">${ic('code')}</div><div class="grow"><div class="title">${esc(i.title)} ${link(i)}</div><div class="meta">Entwicklung läuft, noch kein PR</div><div class="flow">${STAGES.map((s, x) => `<span class="${x === 0 ? 'on' : ''}">${s}</span>`).join('')}</div></div></div>`;
    }
    $('now').innerHTML = nowHtml || '<p class="empty">Nichts in Arbeit.</p>';

    // History
    const entries = data.comments.map(classify).filter(Boolean).filter(e => new Date(e.time) >= from);
    const newFixes = data.items.filter(i => labels(i).includes('typ:nachbesserung') && new Date(i.created_at) >= from);
    for (const i of newFixes) entries.push({ time: i.created_at, no: i.number, title: 'Neue Nachbesserung: ' + i.title.replace(/^(Nachbesserung|Follow-up fix) · /, ''), status: '', text: '', url: i.html_url, tone: 'blue', icon: 'new', important: true });
    const mergedEvents = data.events.filter(e => e.event === 'merged' && new Date(e.created_at) >= from);
    const blockedEvents = data.events.filter(e => e.event === 'labeled' && e.label && e.label.name === 'pipeline:blockiert' && new Date(e.created_at) >= from);
    for (const e of blockedEvents) entries.push({ time: e.created_at, no: e.issue.number, title: 'Blockiert', status: '', text: '', url: e.issue.html_url, tone: 'coral', icon: 'warning', important: true, blocked: true });
    entries.sort((a, b) => new Date(b.time) - new Date(a.time));

    const rounds = entries.filter(e => e.back && e.important).length;
    $('numbers').innerHTML = [
      ['primary', mergedEvents.length, 'gemergt'],
      ['mustard', rounds, 'zurück in Nacharbeit'],
      ['', newFixes.length, 'neue Nachbesserungen'],
      ['coral', blockedEvents.length, 'blockiert'],
    ].map(([c, n, t]) => `<div class="chip ${n ? c : ''}"><b>${n}</b><span>${t}</span></div>`).join('');

    const showAll = $('all').checked;
    const visible = entries.filter(e => showAll || e.important);
    let html = '', lastDay = '';
    for (const e of visible) {
      const t = day(e.time);
      if (t !== lastDay) { if (html) html += '</div>'; html += `<div class="day">${esc(t)}</div><div class="card">`; lastDay = t; }
      const it = byNo[e.no];
      const isNew = new Date(e.time) > visit;
      const tagTone = e.blocked ? 'coral' : e.back ? 'mustard' : e.merged ? '' : 'muted';
      html += `<div class="row"><div class="icon ${e.tone === 'primary' ? '' : e.tone}">${ic(e.icon)}</div><div class="grow">`
        + `<div class="heading"><div class="title">${isNew ? '<span class="new" title="neu"></span>' : ''}${esc(e.title)}</div>${e.status ? `<span class="tag ${tagTone}">${esc(e.status)}</span>` : ''}</div>`
        + `<div class="meta">${time(e.time)} · ${it ? esc(it.title) + ' ' : ''}<a href="${esc(e.url)}">#${e.no}</a></div>`
        + (e.text && e.important ? `<details><summary>Ganze Meldung</summary><div class="body">${esc(e.text)}</div></details>` : '')
        + `</div></div>`;
    }
    if (html) html += '</div>';
    $('history').innerHTML = html || `<div class="card"><p class="empty" style="margin:0">${range === 'visit' ? 'Seit deinem letzten Besuch ist nichts passiert.' : 'In diesem Zeitraum ist nichts passiert.'}</p></div>`;

    // Queue (same order as scripts/pipeline.sh naechstes-feature)
    const ready = open.filter(i => !i.pull_request && labels(i).includes('status:bereit') && !labels(i).includes('pipeline:blockiert'));
    const fixes = ready.filter(i => labels(i).includes('typ:nachbesserung')).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    const features = ready.filter(i => /^F-\d{2} /.test(i.title)).sort((a, b) => a.title.localeCompare(b.title));
    const closedFeatures = new Set(data.items.filter(i => i.state === 'closed' && /^F-\d{2} /.test(i.title)).map(i => i.title.slice(0, 4)));
    const queue = [...fixes, ...features];
    $('queue').innerHTML = queue.length ? queue.map((i, x) => {
      // The German keyword «Voraussetzung:» (prerequisite) in issue bodies stays (E-68).
      const prerequisites = ((i.body || '').match(/Voraussetzung:\**([^\n]*)/) || [])[1] || '';
      const openPrerequisites = (prerequisites.match(/F-\d{2}/g) || []).filter(v => !closedFeatures.has(v));
      const meta = labels(i).includes('typ:nachbesserung') ? 'Nachbesserung' : openPrerequisites.length ? 'wartet auf ' + openPrerequisites.join(', ') : 'bereit';
      return `<div class="row"><div class="icon ${labels(i).includes('typ:nachbesserung') ? 'mustard' : ''}">${x + 1}</div><div class="grow"><div class="title">${esc(i.title)} ${link(i)}</div><div class="meta">${esc(meta)}</div></div></div>`;
    }).join('') : '<p class="empty">Die Warteschlange ist leer.</p>';
  }

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    range = b.dataset.range;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  $('all').addEventListener('change', render);
  $('reload').addEventListener('click', load);
  $('mark-read').addEventListener('click', () => {
    visit = Date.now();
    store.sset(KEY_VISIT, String(visit));
    store.set(KEY_LAST_VISIT, String(visit));
    render();
  });
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, 5 * 60000);
  load();
})();
</script>
</body>
</html>
