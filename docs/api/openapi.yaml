openapi: 3.1.0
info:
  title: StvBeroPlatform API
  version: 0.1.0
  summary: REST API of the core (persons, teams, lines, events, responses, match days, call-up, attendance check, statistics).
  description: |
    Contract between frontend, backend and test agents. **Contract first:** changes to the API
    are made here first, then implemented. Conventions: [README.md](README.md).

    Requirement IDs (e.g. `ANM-04`) refer to `docs/requirements/`.
    Endpoints with the tag `Test` exist only in the Quarkus profiles `dev` and `test`.

    Machine-readable parts (paths, fields, enum values, problem types) are English. Texts shown to
    users (`title` and `detail` of problems, notification texts, seed names) stay German (NF-40, E-68).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local (Quarkus dev/test)
security:
  - session: []
tags:
  - name: Me
    description: Signed-in person, tiles
  - name: Seasons
    description: Seasons and archive (SAI)
  - name: Teams
    description: Teams and team memberships (PTF)
  - name: Lines
    description: Lines and goalies (LIN)
  - name: Persons
    description: Person administration (admin, coach)
  - name: Events
    description: Events, series (TER)
  - name: Responses
    description: Responses, overview (ANM)
  - name: MatchDays
    description: Matches and call-up (AUF)
  - name: Attendance
    description: Attendance check (PRS)
  - name: DriverList
    description: Driver list for match days (DRV)
  - name: Statistics
    description: Attendance statistics (STA)
  - name: SwissUnihockey
    description: swiss unihockey integration (SUH)
  - name: Notifications
    description: Notifications in the app, by e-mail and push (BEN)
  - name: Calendar
    description: Calendar subscription with an iCalendar feed (CAL)
  - name: Test
    description: Only in the profiles dev and test. See docs/testability.md.

paths:
  # ---------------------------------------------------------------- Me
  /api/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Signed-in person with the team memberships of the current season
      description: |
        If no season is set as current (SAI-03), the API responds with 409, title «Keine
        aktuelle Saison», rule SAI-03. The user interface then shows a notice instead of the start page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/me/calendar:
    get:
      tags: [Calendar]
      operationId: getMyCalendar
      summary: Personal address of the calendar feed; created on first call (CAL-01)
      description: |
        Every person has at most one address. The first call creates it with a new random token; later calls
        return the same address until it is renewed. The app puts its own address in front of `feedPath`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarSubscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/me/calendar/renew:
    post:
      tags: [Calendar]
      operationId: renewMyCalendar
      summary: New address for the calendar feed; the old one answers 404 at once (CAL-07)
      responses:
        '200':
          description: New address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarSubscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/calendar/{token}.ics:
    get:
      tags: [Calendar]
      operationId: getCalendarFeed
      summary: iCalendar feed of a person, reachable with the token alone (CAL-02 to CAL-08)
      description: |
        Public, because calendar apps cannot log in (CAL-06). The token grants read access to this feed only;
        it is not a session. Content: all events of the person's teams (member in the season of the event)
        that ended at most 30 days ago or are still to come, cancelled ones with `STATUS:CANCELLED`. `UID` is
        the event ID plus `@stvbero`, so moved events replace their entry. Times are local times in
        Europe/Zurich with a `VTIMEZONE`. The description holds meeting point, matches, notes, the person's
        own response and the link into the app, never responses or comments of other people (CAL-08).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: 43 characters, Base64 URL-safe (256 random bits)
          schema: { type: string }
      responses:
        '200':
          description: iCalendar (RFC 5545)
          content:
            text/calendar:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/tiles:
    get:
      tags: [Me]
      operationId: listTiles
      summary: Tiles the signed-in person may see (NF-11, NF-12)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/session:
    get:
      tags: [Me]
      operationId: getSession
      summary: Whether a valid session exists
      description: |
        Public and always 200, so the user interface can check without an error response whether it
        has to redirect to the login. The person's data comes from `GET /api/me`.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /api/logout:
    post:
      tags: [Me]
      operationId: logout
      summary: End the session and delete the session cookie
      description: Succeeds even without a valid session, so logging out always works.
      security: []
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }

  # ---------------------------------------------------------------- Seasons
  /api/seasons:
    get:
      tags: [Seasons]
      operationId: listSeasons
      summary: All seasons, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Season' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Seasons]
      operationId: createSeason
      summary: Create a season, optionally with carry-over from the previous season (SAI-04, admin)
      description: |
        The new season is not current yet. With `copyFrom`, the teams and team memberships of that
        season are carried over. Name already taken or period overlaps with another season: 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSeason' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/seasons/{seasonId}/activate:
    parameters:
      - $ref: '#/components/parameters/seasonId'
    post:
      tags: [Seasons]
      operationId: activateSeason
      summary: Make a season the current season (SAI-03, SAI-06, admin)
      responses:
        '204': { description: Activated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Teams
  /api/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Teams of a season. Admins and coaches get all teams, players only their own.
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a team (admin, coach)
      description: The team belongs to the given season from now on. Archived seasons are read-only (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Team with coaches and players by group
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Teams]
      operationId: renameTeam
      summary: Rename a team (admin, coach)
      description: |
        The name applies per season. Only the given season is renamed (default: current); older
        seasons keep the name they had. Archived seasons are read-only (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/warning-minimums:
    parameters:
      - $ref: '#/components/parameters/teamId'
    put:
      tags: [Teams]
      operationId: setWarningMinimums
      summary: Change the minimums for the warnings of the team (F-16, admin, coach)
      description: |
        Below these numbers coaches and admins see warnings for upcoming practices and match days and for the
        call-up. 0 switches a warning off. The minimums apply to the team, not per season (assumption F-16).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarningMinimums' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarningMinimums' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/teams/{teamId}/match-day-settings:
    parameters:
      - $ref: '#/components/parameters/teamId'
    put:
      tags: [Teams]
      operationId: setMatchDaySettings
      summary: Change match duration, arrival lead and usual meeting point of the team (TML-02, TML-03, AUF-32, admin, coach)
      description: |
        `matchDurationMinutes` (default 50) is how long a match takes; `arrivalLeadMinutes` (default 70) how long
        before the first match the team wants to arrive at the venue. Both feed the timeline of every match day
        and the suggested departure (TML). `meetingPoint` is where the team usually meets: match days created by
        the sync start with it (AUF-32); `null` or empty removes it. The settings apply to the team, not per
        season.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchDaySettings' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDaySettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/teamId'
    post:
      tags: [Teams]
      operationId: addMember
      summary: Add a person with a team role to the team (PTF-03, PTF-04, admin, coach)
      description: |
        A person has exactly one team role per team and season. If the person is already a member, the
        API responds with 409 (rule PTF-04). Archived seasons are read-only (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInput' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/members/{personId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
      - $ref: '#/components/parameters/personId'
    put:
      tags: [Teams]
      operationId: changeTeamRole
      summary: Change the team role (admin, coach)
      description: |
        If a player becomes a coach, she loses her line assignment in this team.
        Archived seasons are read-only (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamRole]
              properties:
                teamRole: { $ref: '#/components/schemas/TeamRole' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Teams]
      operationId: removeMember
      summary: Remove a person from the team (admin only, RR-08). Existing responses are kept.
      description: Archived seasons are read-only (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Lines
  /api/teams/{teamId}/groups:
    parameters:
      - $ref: '#/components/parameters/teamId'
    get:
      tags: [Lines]
      operationId: getLineup
      summary: Lines and goalies of a team with their players, plus «Ohne Linie» (no line)
      description: Current season. For members of the team (any team role), coaches and admins, otherwise 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lineup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Lines]
      operationId: createLine
      summary: Create a line (LIN-07, coach). Each team automatically has exactly one goalies group.
      description: |
        Applies to the current season (LIN-11). Without `sortOrder` the line goes to the end, otherwise to
        that position (the others move down). Names are unique per team, otherwise 409 (LIN-09).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
      - $ref: '#/components/parameters/groupId'
    put:
      tags: [Lines]
      operationId: updateLine
      summary: Rename a line or change its order (coach)
      description: |
        With `sortOrder` the line moves to that position and the others are renumbered (1, 2, …).
        Goalies can neither be renamed nor moved (409, LIN-05).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Lines]
      operationId: deleteLine
      summary: Delete a line (admin only, RR-08). Its players then have no line. Goalies cannot be deleted (409).
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/assignments/{personId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
      - $ref: '#/components/parameters/personId'
    put:
      tags: [Lines]
      operationId: setAssignment
      summary: Assign a player to a group or set her to no line (LIN-02, LIN-07, LIN-10)
      description: |
        Replaces an existing assignment in the same team (at most one group per team).
        Only persons with team role `PLAYER` in this team, otherwise 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId:
                  type: [string, 'null']
                  format: uuid
                  description: '`null` = no line'
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Persons
  /api/persons:
    get:
      tags: [Persons]
      operationId: listPersons
      summary: All persons (admin, coach)
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Part of the first or last name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Person' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Persons]
      operationId: createPerson
      summary: Create a person (admin, coach)
      description: Only admins may set `admin` to true; a coach doing so gets 403 (RR-04, E-69).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/persons/{personId}:
    parameters:
      - $ref: '#/components/parameters/personId'
    get:
      tags: [Persons]
      operationId: getPerson
      summary: Person with all team memberships (admin, coach)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Persons]
      operationId: updatePerson
      summary: Update a person (admin, coach)
      description: |
        The admin permission cannot be taken away from the last person who has it (409, RR-04).
        Only admins change `admin`. For a coach a missing `admin` keeps the flag, a different value gives 403 (E-69).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Events
  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: Events of the person's own teams with the person's own response (TER-13)
      description: |
        Without `team`, the events of the person's own teams. With `team`, admins and coaches get the
        events of that team even if they are not a member (RR-03, E-69); everyone else only if it is one
        of their teams.
      parameters:
        - name: from
          in: query
          description: Default is «now» (backend clock)
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: team
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/EventType' }
        - name: view
          in: query
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
      responses:
        '200':
          description: Sorted chronologically (past events descending)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a single event, match day or other event (TER-11, AUF-16, coach)
      description: |
        The person must be an admin or a coach (in any team, RR-03, E-69), otherwise 403.
        A match day has exactly one team (AUF-03). An event in the past gives 400, one in an archived
        season 409 (SAI-02). Without `responseDeadlineHours`, 24 hours apply (TER-10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Event with the person's own response; for a match day with matches, meeting point and own call-up status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      operationId: updateEvent
      summary: Update or reschedule an event (TER-06, TER-12, coach)
      description: |
        A changed start time counts as rescheduling (`rescheduled`) and notifies all members of the teams involved (BEN-07).
        Responses are kept. For an event of a series, the change applies only to this event; it no longer takes over
        later changes to the series (TER-06). Cancelled or past events: 409.
        Match day moved to another day: manually entered matches move with it. If it has matches from swiss unihockey,
        it can only be rescheduled on the same day (422 on field `start`, rule SUH-05, assumption O-48).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Cancel an event (TER-06, TER-12, coach). After that, no more responses are possible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, examples: [Halle besetzt] }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/series:
    post:
      tags: [Events]
      operationId: createSeries
      summary: Create a series; creates the events in the validity period (TER-05, coach)
      description: |
        Creates an event for each matching weekday in the validity period that has not started yet. Permissions as for
        `createEvent`. The period lasts at most one year (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/seriesId'
    get:
      tags: [Events]
      operationId: getSeries
      summary: Series with its series exceptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      operationId: updateSeries
      summary: Update a series. Applies to future events; given responses are kept (TER-08, coach).
      description: |
        Future events take over the new data. Individually changed and cancelled events stay unchanged.
        Events that no longer fit the series are removed, or cancelled («Serie geändert») if someone
        has already responded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/series/{seriesId}/exceptions:
    parameters:
      - $ref: '#/components/parameters/seriesId'
    post:
      tags: [Events]
      operationId: createSeriesException
      summary: Exclude a period from the series, e.g. holidays (TER-07, coach)
      description: |
        Future planned events of the series in the period are removed. If someone has already responded, the
        event is cancelled instead, with the reason of the series exception as cancellation reason (O-19).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesException' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Responses
  /api/events/{eventId}/overview:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [Responses]
      operationId: getOverview
      summary: Responses by team and group, coach block, counts (ANM-20 to ANM-32)
      description: |
        Comments are only included if the requesting person is a coach in the respective team
        or it is their own response (ANM-07). Empty groups are left out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/events/{eventId}/responses/me:
    parameters:
      - $ref: '#/components/parameters/eventId'
    put:
      tags: [Responses]
      operationId: setOwnResponse
      summary: Set or change the person's own response (ANM-01 to ANM-10)
      description: |
        Only members of a team involved (any team role), otherwise 403. `MAYBE` requires a
        comment (otherwise 422, field `comment`). A change away from `ATTENDING` after the response deadline is a
        late cancellation (`lateCancellation`) and notifies the coaches (ANM-10, BEN-02). The flag
        stays until the next `ATTENDING`. For cancelled and past events 409 (TER-06).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Response' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/events/{eventId}/responses/{personId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/personId'
    put:
      tags: [Responses]
      operationId: setResponseOnBehalf
      summary: Respond on behalf of a person (ANM-11, ANM-12, RR-06)
      description: |
        Only coaches (of any team, RR-03, E-69) and admins, for every member of a team involved.
        Otherwise 403. If the person belongs to no team involved, 404. The same rules
        apply as for the person's own response; `enteredBy` is the requesting person (ANM-12).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Response' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ---------------------------------------------------------------- Match days
  /api/events/{eventId}/matches:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [MatchDays]
      operationId: addMatch
      summary: Add a match to a match day (AUF-14, coach)
      description: |
        Only for match days (otherwise 409, rule AUF-01), as long as the match day is neither cancelled nor over (409, TER-06).
        The start time lies on the day of the match day (otherwise 400 on field `startTime`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/matchId'
    put:
      tags: [MatchDays]
      operationId: updateMatch
      summary: Update a match, e.g. enter the result (AUF-15, coach). Imported fields are read-only (409).
      description: |
        The result (home:away) can also be entered after the match day; only a cancelled match day gives 409 (TER-06).
        For matches from swiss unihockey, opponent, start time and home/away are read-only (409, rule SUH-06).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [MatchDays]
      operationId: deleteMatch
      summary: Delete a manually entered match (coach)
      description: |
        Matches from swiss unihockey only if swiss unihockey no longer delivers them (otherwise 409, rule SUH-06).
        Cancelled or past match days: 409 (TER-06).
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/matches/{matchId}/confirm-su-change:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/matchId'
    post:
      tags: [MatchDays]
      operationId: confirmSuChange
      summary: Confirm a change by swiss unihockey as seen; the warning disappears (SUH-12, coach)
      description: |
        The sync applies changed matches right away (SUH-05) and remembers what the match looked like before
        (`suChange` of the match). Coaches of the team and admins confirm that they have seen the change; until
        then the match day shows the warning `MATCH_CHANGED`. 409 (rule SUH-12) if the match has no open change.
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/timeline:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [MatchDays]
      operationId: getTimeline
      summary: 'Timeline of a match day: departure, arrival, matches, cool down, approximate return (TML-01)'
      description: |
        Everyone who may see the match day. Not a match day: 409 (rule DRV-01). `items` in order of time:
        `DEPARTURE` at the meeting time, or at the suggested departure while no meeting time is set
        (`departureSuggested`); `ARRIVAL` after the driving time of the route (DRV-05); `WARM_UP` until the first
        match; each `MATCH` for the match duration of the team; `BREAK` between two matches; `COOL_DOWN` of 20
        minutes after the last match; `RETURN` after the driving time back. The suggested departure is the first
        match minus the arrival lead of the team minus the driving time, rounded down to five minutes (TML-04).
        Without a meeting point or without a driving time there is no departure suggestion, no arrival and no
        return; `hints` says why. Matches that swiss unihockey no longer delivers are left out. With several teams
        the longest match duration and the longest arrival lead apply. Calculates the route first if needed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/timeline/apply-departure:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [MatchDays]
      operationId: applySuggestedDeparture
      summary: Take over the suggested departure as meeting time of the match day (TML-04, coach)
      description: |
        Coaches of the team and admins, for a planned match day that is not over. 409 (rule TML-04) if there is
        no suggestion (no meeting point or no driving time).
      responses:
        '200':
          description: Taken over
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/call-up:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [MatchDays]
      operationId: getCallUp
      summary: Call-up with all players of the team, grouped, with response status (AUF-21, AUF-22, coach)
      description: |
        Only coaches (of any team, E-69) and admins (otherwise 403). Not a match day: 409 (rule AUF-02). Coaches are not part of
        the selection (AUF-28). Groups as in the overview; empty groups are left out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [MatchDays]
      operationId: setCallUp
      summary: Save the selection (coach). If the call-up is published, the players affected are notified (AUF-27).
      description: |
        Replaces the whole selection. Every player of the team can be called up, regardless of her response (AUF-22).
        Coaches or persons outside the team: 422 (rule AUF-28). Not a match day, cancelled or over: 409.
        A published call-up stays published. Players who are added or removed are notified (BEN-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personIds]
              properties:
                personIds:
                  type: array
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallUp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/events/{eventId}/call-up/publish:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [MatchDays]
      operationId: publishCallUp
      summary: Publish the call-up and notify all players of the team (AUF-23, AUF-24, coach)
      description: |
        Only a draft with at least one player (otherwise 409, rule AUF-23), only once. After that the
        players see `myCallUp`. They are notified (BEN-03).
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Attendance check
  /api/events/{eventId}/attendance:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [Attendance]
      operationId: getAttendance
      summary: Attendance with all players of the involved teams, grouped, with response and attendance (PRS-03, coach)
      description: |
        Only coaches (of any team, E-69) and admins (otherwise 403, PRS-10). Check switched off: 409 (rule PRS-07).
        Cancelled: 409 (rule PRS-09). Before the start: 409 (rule PRS-02). Coaches are not part of the list (PRS-05).
        Groups as in the overview; empty groups are left out. Without a recorded value the status is the
        preselection: «dabei» → PRESENT, everything else → ABSENT (`recorded: false`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attendance' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Attendance]
      operationId: recordAttendance
      summary: Save or correct the attendance (PRS-03, PRS-04, coach)
      description: |
        Sets the status of the given players; players not in the list keep their earlier value (PRS-04). Stores who
        saved and when; the last value counts. Coaches or persons outside the teams: 422 (rule PRS-05). A person twice:
        400. Same 409 cases as GET, plus an archived season (SAI-02). Responses are not changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ---------------------------------------------------------------- Driver list
  /api/events/{eventId}/driver-list:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [DriverList]
      operationId: getDriverList
      summary: Driver list of a match day with cars, passengers, route and who has no seat (DRV-01 to DRV-10)
      description: |
        Members of the teams of the match day (any team role), coaches (of any team, E-69) and admins; otherwise 403.
        Not a match day: 409 (rule DRV-01). Without meeting point or venue `ready` is false, `missing` names what is
        missing and there is no `route` (DRV-01). Otherwise the route from the meeting point to the venue is
        calculated on the first view and stored; it is calculated again when meeting point or venue changed, or
        when the service was unavailable more than 10 minutes ago (DRV-05, DRV-07, DRV-08). A cancelled match day
        keeps its list and route, but `creditKm` is missing (DRV-10). `withoutSeat`: with a published call-up the
        called-up players, otherwise the players who responded «dabei», without drivers and passengers (DRV-04).
        `members` only for coaches and admins.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/driver-list/cars:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [DriverList]
      operationId: addCar
      summary: 'Enter a car: oneself, or someone else as coach or admin (DRV-02)'
      description: |
        Without `driverId` the caller drives. Someone else: only coaches and admins (otherwise 403). The driver must be
        a member of a team of the match day (422, rule DRV-02) and drives at most one car (409, rule DRV-02). If she
        sat in another car, she leaves that seat. Not usable (meeting point or venue missing, DRV-01), cancelled
        (DRV-10), archived season: 409. After the end of the match day only coaches and admins (409, rule DRV-02).
        Seats 1 to 8 (400). Notifies the driver if someone else entered her (DRV-11). Answers with the whole list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarInput' }
      responses:
        '200':
          description: The driver list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/events/{eventId}/driver-list/cars/{carId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/carId'
    put:
      tags: [DriverList]
      operationId: changeCarSeats
      summary: Change the number of seats of a car (DRV-02, DRV-03)
      description: |
        The driver herself, coaches and admins. Fewer seats than passengers: 422 (rule DRV-03). Same 409 cases as
        `addCar`. Notifies the driver if someone else changed it (DRV-11).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatsInput' }
      responses:
        '200':
          description: The driver list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
    delete:
      tags: [DriverList]
      operationId: removeCar
      summary: Remove a car; its passengers lose their seat (DRV-02, DRV-11)
      description: |
        The driver herself, coaches and admins. The passengers are notified, and the driver if someone else removed
        the car (DRV-11). Same 409 cases as `addCar`.
      responses:
        '200':
          description: The driver list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/driver-list/cars/{carId}/passengers/{personId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/carId'
      - $ref: '#/components/parameters/personId'
    put:
      tags: [DriverList]
      operationId: addPassenger
      summary: Put a person into a car, or move her from another car (DRV-03)
      description: |
        Oneself: every member of a team of the match day. Someone else: coaches and admins (otherwise 403). A person
        sits in at most one car: from another car she moves. Already in this car: no change. Car full: 409 (rule
        DRV-03). A driver cannot ride along (422, rule DRV-03); not a member: 422 (rule DRV-02). Notifies the driver
        (and the previous driver when moving) and, if someone else made the change, the passenger (DRV-11).
      responses:
        '200':
          description: The driver list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
    delete:
      tags: [DriverList]
      operationId: removePassenger
      summary: Take a person out of a car (DRV-03)
      description: |
        Oneself, or someone else as coach or admin. Not in this car: 404. Notifies the driver and, if someone else
        made the change, the passenger (DRV-11).
      responses:
        '200':
          description: The driver list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/driver-list/route:
    parameters:
      - $ref: '#/components/parameters/eventId'
    put:
      tags: [DriverList]
      operationId: setRouteDistance
      summary: Enter the kilometres of the route by hand (DRV-07, coach)
      description: |
        Only coaches and admins (otherwise 403). One-way kilometres 0.1 to 1000 (400). The route gets the status
        MANUAL for the current meeting point and venue, without driving time; it stays until meeting point or venue
        change or the route is calculated again. Same 409 cases as `addCar`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteInput' }
      responses:
        '200':
          description: The driver list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/driver-list/route/recalculate:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [DriverList]
      operationId: recalculateRoute
      summary: Calculate the route again with the routing service (DRV-07, coach)
      description: |
        Only coaches and admins (otherwise 403). Replaces kilometres entered by hand. If the service is unavailable
        or finds nothing, the route has the status UNAVAILABLE or NOT_FOUND (still 200). Same 409 cases as `addCar`.
      responses:
        '200':
          description: The driver list after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/driver-summary:
    get:
      tags: [DriverList]
      operationId: getDriverSummary
      summary: Trips and credited kilometres per person in a season (DRV-09)
      description: |
        Coaches (of any team, E-69) and admins see every person who drove in the season (`everyone: true`), all
        other people only themselves (one row, also with 0 trips). A trip is a car on a match day of the season that
        is not cancelled (DRV-10), upcoming ones included; the credit is twice the distance of the route. Trips
        without known distance count as trips without kilometres (`tripsWithoutDistance`). Routes not yet
        calculated are calculated first. Sorted by name.
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/teams/{teamId}/driver-plan:
    parameters:
      - $ref: '#/components/parameters/teamId'
    get:
      tags: [DriverList]
      operationId: getDriverPlan
      summary: 'Driver plan of a team for a season: all match days with their cars, and the trips per member (DRV-14, DRV-17)'
      description: |
        Members of the team in the season, coaches (of any team, E-69) and admins; otherwise 403. `matchDays` are
        all match days of the team in the season by start, each with its cars as in the driver list of the match
        day, the route if known, and `changeable` if the caller can enter drivers right now (ready, not cancelled,
        not over; after the end only coaches and admins). `shares` lists every member of the team with the trips
        on match days that are over (`trips`, `kilometres`) and on upcoming ones (`plannedTrips`,
        `plannedKilometres`), so that the trips can be shared fairly (DRV-17); a cancelled match day counts
        nothing (DRV-10). `members` only for coaches and admins. Routes not yet calculated are calculated first,
        at most twelve per call.
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/teams/{teamId}/driver-plan/cars:
    parameters:
      - $ref: '#/components/parameters/teamId'
    post:
      tags: [DriverList]
      operationId: planDriver
      summary: Enter one driver for several match days at once (DRV-14)
      description: |
        Often one person plans the drivers of a whole season. Members of the team enter themselves (without
        `driverId`), coaches and admins also others. Per match day the rules of the driver list apply (DRV-01,
        DRV-02): the match day must be ready, not cancelled and, for members, not over; the driver must be a
        member of the team. Match days on which the person already drives stay as they are. If one match day
        refuses, nothing is entered. `eventIds` must be match days of this team in the season (400 on `eventIds`
        otherwise).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverPlanInput' }
      responses:
        '200':
          description: Entered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ---------------------------------------------------------------- Statistics
  /api/statistics:
    get:
      tags: [Statistics]
      operationId: getTeamStatistics
      summary: Statistics of a team per player, by line, with the team average (STA-01 to STA-05, coach)
      description: |
        Only coaches (of any team, E-69) and admins (otherwise 403, STA-01). Counts the past events of the team in
        the period (start before «now» of the backend clock), without cancelled ones; a player only from the day
        she joined the team (STA-07). Players by line as in the team page, empty groups are left out. The
        attendance rate is based only on events with recorded attendance and the check switched on
        (`attendanceEvents`, STA-04). Without `team`: the first team the person coaches, otherwise the first team
        by name.
      parameters:
        - name: team
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: First day; default the start of the season. Determines the season (otherwise the current one)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last day (included); default the end of the season. Must lie in the same season (otherwise 400)
          schema: { type: string, format: date }
        - name: type
          in: query
          description: Only events of this type; without it all types
          schema: { $ref: '#/components/schemas/EventType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamStatistics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/statistics/persons/{personId}:
    parameters:
      - $ref: '#/components/parameters/personId'
    get:
      tags: [Statistics]
      operationId: getPersonStatistics
      summary: Statistics of one player with her events (STA-06, STA-08)
      description: |
        The person herself, coaches (of any team, E-69) and admins; everyone else 403 (STA-08). Same counting as
        the team statistics. `teams` are the teams in which the person is a player in the season; without `team`
        the first of them. Without such a team, `team` and `statistics` are null. A team she does not play in: 404.
        Events newest first, with response, late cancellation and, where recorded, attendance.
      parameters:
        - name: team
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/EventType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonStatistics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- swiss unihockey
  /api/swiss-unihockey/teams:
    get:
      tags: [SwissUnihockey]
      operationId: listSuClubTeams
      summary: Teams of the club at swiss unihockey in the current season, with the team they are linked with (SUH-02, admin, coach)
      description: |
        The choice in the link dialog: the teams swiss unihockey lists for the club (`STV_SU_CLUB_ID`) in the
        current season, in its order. `linkedTeamId` and `linkedTeamName` name the team of the app a team is
        already linked with. 502 if swiss unihockey is unavailable (SUH-09); the dialog then takes the team ID by
        hand.
      responses:
        '200':
          description: In the order of swiss unihockey
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SuClubTeam' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: swiss unihockey unavailable or unexpected answer (SUH-09)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/swiss-unihockey/status:
    get:
      tags: [SwissUnihockey]
      operationId: getSuStatus
      summary: 'State of the connection: linked teams, last successful sync, links whose last sync failed (SUH-13, admin, coach)'
      description: |
        For the hint to coaches and admins: if the last sync of a link failed (swiss unihockey not reachable or
        unexpected data), `failures` names the team, the time and a German sentence. The app keeps running with
        the data it has (SUH-09).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/swiss-unihockey:
    parameters:
      - $ref: '#/components/parameters/teamId'
    get:
      tags: [SwissUnihockey]
      operationId: getSuConnection
      summary: Links of the team to swiss unihockey in the current season, with the state of the last sync (SUH-11, SUH-13)
      description: |
        Members of the team, coaches and admins. A team has none, one or several links per season (SUH-11): the
        team at swiss unihockey changes from season to season. `canManage` for coaches and admins.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuConnection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/swiss-unihockey/links:
    parameters:
      - $ref: '#/components/parameters/teamId'
    post:
      tags: [SwissUnihockey]
      operationId: addSuLink
      summary: Link the team with a team at swiss unihockey and load its matches and league right away (SUH-02, SUH-11, admin, coach)
      description: |
        The link applies to the current season. A team at swiss unihockey belongs to at most one team per season
        (409, rule SUH-02); the team must belong to the current season (409, rule SUH-03). Without `name` the
        name is looked up in the club's teams. After linking, the matches are synced and the league is loaded
        immediately. If swiss unihockey cannot be reached, the link is kept, `lastSyncOk` is `false` and the next
        sync tries again (SUH-09, SUH-13).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuLinkInput' }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/swiss-unihockey/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [SwissUnihockey]
      operationId: removeSuLink
      summary: Remove a link (SUH-11, admin, coach)
      description: |
        Imported match days stay. If the team has no link left in the season, the imported matches of its
        upcoming match days are marked `missingAtSu`, so that a coach can remove them (SUH-12).
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/teams/{teamId}/swiss-unihockey/sync:
    parameters:
      - $ref: '#/components/parameters/teamId'
    post:
      tags: [SwissUnihockey]
      operationId: syncSu
      summary: Run the sync now instead of waiting for the daily run (SUH-03, admin, coach)
      description: |
        Syncs the team's matches in the current season, from all its links (SUH-11). Matches on the same day in
        the same hall become one match day (SUH-04); a new match day starts with the usual meeting point of the
        team (AUF-32). Changed matches are taken over; meeting point, notes, responses and call-up
        are kept (SUH-05, SUH-06), all members of the team are notified (BEN-06), and coaches and admins see a
        warning with the values before and after until one of them confirms it (SUH-12). Matches that swiss
        unihockey no longer delivers, or lists as «Abgesagt», are marked, not deleted. Manually entered match
        days stay untouched (SUH-10). 409 if the team is not linked or does not belong to the current season.
        502 if swiss unihockey is unavailable or delivers something unexpected: then nothing changes (SUH-09).
        The same sync runs daily for all linked teams.
      responses:
        '200':
          description: Result of the sync
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: swiss unihockey unavailable or unexpected answer (SUH-09)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/teams/{teamId}/league:
    parameters:
      - $ref: '#/components/parameters/teamId'
    get:
      tags: [SwissUnihockey]
      operationId: getLeague
      summary: League table, upcoming matches and latest results of a team, from the cache (F-17)
      description: |
        Everyone who may see the team: its members in the current season, coaches and admins (F-17, criterion 10);
        others 403. Always the current season. The data comes from the cache that the daily sync and the manual
        reload fill; this request never calls swiss unihockey (criterion 6). `linked: false` if the team is not
        linked with swiss unihockey (all other fields empty). `loadedAt` is the last successful load («Stand»),
        `null` if never loaded in this season. `failedAt` is set if the last attempt after it failed (SUH-09);
        the last loaded data is still returned. `upcoming`: matches without a result that have not ended yet,
        earliest first, at most five. `results`: the last five matches with a result, latest first.
      responses:
        '200':
          description: League data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/League' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/teams/{teamId}/league/refresh:
    parameters:
      - $ref: '#/components/parameters/teamId'
    post:
      tags: [SwissUnihockey]
      operationId: refreshLeague
      summary: Reload the league data from swiss unihockey now instead of waiting for the daily sync (F-17, admin)
      description: |
        Loads league, group, table and matches of the team in the current season and stores them. 409 if the
        team is not linked or does not belong to the current season. 502 if swiss unihockey is unavailable or
        delivers something unexpected: the last loaded data stays and `failedAt` is set (SUH-09).
      responses:
        '200':
          description: Reloaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/League' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: swiss unihockey unavailable or unexpected answer; the last loaded data stays (SUH-09)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------- Notifications
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: The person's own notifications, newest first (BEN-12)
      description: |
        Only the person's own. `unread=true` returns only unread ones (counter in the navigation).
        Notifications are sent for: a reminder 12 hours before the response deadline to everyone without a response,
        once per person and event (BEN-01, BEN-13); a late cancellation to the coaches of the teams in which the
        person is a player (BEN-02, O-17); a called-up player declining, to the same coaches (BEN-04);
        publishing a call-up to all players of the team (BEN-03); a change to a published call-up to newly
        called-up players and players no longer called up (BEN-05); cancellation and rescheduling to all members
        of the teams involved (BEN-07). Whoever triggers something is not notified about it.
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark as read
      description: |
        Marking more than once changes nothing (204). Another person's notification: 403 (RR-07).
      responses:
        '204': { description: Marked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/notification-settings:
    get:
      tags: [Notifications]
      operationId: getMyNotificationSettings
      summary: 'Own channels: e-mail on or off, devices with push (F-19)'
      description: |
        The list in the app always exists. E-mail is on by default if the person has an e-mail address, and can be
        switched off. Push is switched on per device (`/api/me/push-subscriptions`). `emailAvailable` and
        `pushAvailable` are false while the channel is not configured on the server (F-19, criterion 9).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [Notifications]
      operationId: updateMyNotificationSettings
      summary: Switch e-mails on or off (F-19)
      description: Switching on without an e-mail address of the person is refused with 422, rule BEN-10, field `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettingsInput' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/me/push-subscriptions:
    post:
      tags: [Notifications]
      operationId: registerMyPushSubscription
      summary: Push on for this device; the same endpoint again updates it (F-19)
      description: |
        Body: what the browser returns from `PushSubscription.toJSON()` after the person allowed notifications.
        A person can have several devices. If the endpoint was registered by another person before (other person
        signed in on the same device), the device now belongs to the person signed in. `endpoint` must be an
        `https` address, `keys.p256dh` a P-256 public key and `keys.auth` 16 bytes, both base64url. The label
        («Chrome auf Android») comes from the `User-Agent` header. Without VAPID configuration: 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDevice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/me/push-subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Notifications]
      operationId: removeMyPushSubscription
      summary: Push off for a device (F-19)
      description: Only the own devices; another person's device is 403 (RR-07).
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Test
  /api/test/reset:
    post:
      tags: [Test]
      operationId: testReset
      summary: Reset the database to a data set and the simulators
      description: |
        Without `dataset` (or `TEST`): the test data set of docs/test-data.md with the fixed clock and the
        simulators for swiss unihockey and routing, as all automated tests expect. `CLUB`: the club data set with
        the real teams, the running clock, live data from swiss unihockey and real routes; the matches of the
        linked teams are loaded in the background (`GET /api/test/dataset`). Only profiles dev and test.
      security: []
      parameters:
        - name: dataset
          in: query
          schema: { $ref: '#/components/schemas/DataSet' }
      responses:
        '204': { description: Reset }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/test/dataset:
    get:
      tags: [Test]
      operationId: testGetDataSet
      summary: Which data set is loaded, whether the outside world is simulated and whether the club data is still loading
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSetState' }
  /api/test/clock:
    put:
      tags: [Test]
      operationId: testSetClock
      summary: Set the backend clock to a fixed point in time. Runs due jobs (reminders, retries of e-mails and pushes) immediately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [now]
              properties:
                now:
                  type: string
                  format: date-time
                  examples: ['2026-11-16T19:00:00+01:00']
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Test]
      operationId: testGetClock
      summary: Current backend time
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [now, fixed]
                properties:
                  now: { type: string, format: date-time }
                  fixed: { type: boolean }
    delete:
      tags: [Test]
      operationId: testReleaseClock
      summary: Use the real time again
      security: []
      responses:
        '204': { description: Released }
  /api/test/current-season:
    delete:
      tags: [Test]
      operationId: testRemoveCurrentSeason
      summary: Mark no season as current any more (state «no current season»). Reset restores the seed.
      security: []
      responses:
        '204': { description: Removed }
  /api/test/login:
    post:
      tags: [Test]
      operationId: testLogin
      summary: Log in as a seed person without a password. Sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginKey]
              properties:
                loginKey:
                  type: string
                  description: Key from docs/test-data.md
                  examples: [petra]
      responses:
        '204':
          description: Logged in
          headers:
            Set-Cookie:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/test/persons:
    get:
      tags: [Test]
      operationId: testListPersons
      summary: Persons with their key for the test mode login (/dev-login)
      security: []
      responses:
        '200':
          description: By last name, then first name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestPerson' }
  /api/test/notifications:
    get:
      tags: [Test]
      operationId: testListNotifications
      summary: All notifications of all persons since the last reset, including the seed, each with its e-mails and pushes (F-19). Delivers what is due first.
      description: |
        In dev and test nothing is sent to the outside (F-19, criterion 8): every e-mail and push is recorded as a
        delivery with its channel. Before the list is returned, everything due is delivered, so the result does not
        depend on the background thread.
      security: []
      responses:
        '200':
          description: Chronological
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestNotification' }
  /api/test/delivery:
    put:
      tags: [Test]
      operationId: testSetDelivery
      summary: Let e-mail or push fail, or report push endpoints as expired (simulated, F-19)
      description: |
        Applies until the next call or reset. `failing`: deliveries of these channels fail and are retried
        (1, 5, 30, 120 minutes; setting the clock runs due retries). `expiredEndpoints`: the simulated push service
        answers 410 for these endpoints; the device is removed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                failing:
                  type: [array, 'null']
                  items: { $ref: '#/components/schemas/NotificationChannel' }
                  description: Channels whose delivery fails until the next change or reset (F-19, criterion 7)
                expiredEndpoints:
                  type: [array, 'null']
                  items: { type: string }
                  description: Push endpoints the simulated push service reports as expired (F-19, criterion 7)
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/test/swiss-unihockey/matches:
    put:
      tags: [Test]
      operationId: testSetSuMatches
      summary: Set the data the simulator delivers for a swiss unihockey team ID (matches for the sync, league view for the league page, outage)
      description: |
        `matches` is what the sync receives. `league` is what the league page loads (F-17): league, group, table
        and the matches of the league view (without `matches` inside `league`, the matches of the sync). Without
        `league` the league view of this team ID stays as it is. `unavailable` makes both fail (SUH-09).
        After `POST /api/test/reset` team ID 900001 delivers match 01 and 02 and the league of Team 1
        (docs/test-data.md).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suTeamId, matches]
              properties:
                suTeamId: { type: integer, examples: [900001] }
                unavailable:
                  type: boolean
                  default: false
                  description: Simulates an outage (SUH-09)
                matches:
                  type: array
                  items: { $ref: '#/components/schemas/SuMatch' }
                league:
                  description: League view (F-17). Omitted, the league view of this team ID stays as it is
                  oneOf:
                    - $ref: '#/components/schemas/SuLeague'
                    - type: 'null'
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/test/swiss-unihockey/club:
    put:
      tags: [Test]
      operationId: testSetSuClub
      summary: Set the teams of the club the simulator lists for the link dialog, or an outage (SUH-02)
      description: |
        After `POST /api/test/reset` the simulator lists team ID 900001 «Herren KF 3. Liga», 900002 «Damen KF 2.
        Liga» and 900003 «Junioren B» (docs/test-data.md). `unavailable` makes the list fail (SUH-09); the
        matches of a team ID are set with `PUT /api/test/swiss-unihockey/matches`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuClubPreset' }
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/test/routing:
    put:
      tags: [Test]
      operationId: testSetRouting
      summary: Set the routes the routing simulator delivers per pair of places, or an outage (DRV-06)
      description: |
        Pairs are matched by the label of the places: the text of the meeting point and the name of the venue,
        ignoring case. Without `distanceKm` there is no route for the pair (DRV-07). `unavailable` makes every
        calculation fail until the next call or reset. After `POST /api/test/reset` the simulator knows
        «Parkplatz Sporthalle Nord» → «Sporthalle Seefeld» (23.4 km, 26 min, match day 04) and «Sporthalle Nord» →
        «Turnhalle Weid» (12.6 km, 16 min, match day 05); every other pair has no route (docs/test-data.md).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingPreset' }
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: stv_session
      description: Session cookie. The production login method is open (O-01).

  parameters:
    season:
      name: season
      in: query
      description: Season ID. Default is the current season.
      schema: { type: string, format: uuid }
    seasonId:
      name: seasonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    teamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    personId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    eventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    seriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, format: uuid }
    matchId:
      name: matchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    carId:
      name: carId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Not logged in
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: No permission (RR-07)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Request formally invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with the current state (e.g. event cancelled, already a member)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RuleViolation:
      description: Domain rule violated (e.g. `MAYBE` without a comment)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details. `title`, `detail` and `fields[].message` are German texts that can be shown to users directly. `type`, `rule` and `fields[].field` are machine-readable and English.
      required: [status, title]
      properties:
        type: { type: string, format: uri, examples: ['urn:stv:problem:comment-required'] }
        title: { type: string, examples: [Kommentar fehlt] }
        status: { type: integer, examples: [422] }
        detail: { type: string, examples: ['Bei «vielleicht» ist ein Kommentar Pflicht.'] }
        rule: { type: string, description: Violated requirement, examples: [ANM-04] }
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, examples: [comment] }
              message: { type: string }

    CalendarSubscription:
      type: object
      description: Personal address of the calendar feed (CAL-01). Whoever knows it sees the person's events.
      required: [feedPath]
      properties:
        feedPath:
          type: string
          description: Path of the feed with the token. The app puts its own address in front of it.
          examples: ['/api/calendar/q3XyR0p8vUu6Yc1yZf9xwGx0N2m7oVbE4hT5sK1dLaA.ics']

    TeamRole:
      type: string
      enum: [PLAYER, COACH]
      description: Extensible (PTF-06). Clients treat unknown values like a member without special permissions.
    EventType:
      type: string
      enum: [PRACTICE, MATCH_DAY, OTHER]
    EventStatus:
      type: string
      enum: [PLANNED, CANCELLED]
      description: Whether an event is over follows from `end` and the backend clock.
    ResponseStatus:
      type: string
      enum: [PENDING, ATTENDING, DECLINED, MAYBE]
    GroupType:
      type: string
      enum: [LINE, GOALIES]
    CallUpStatus:
      type: string
      enum: [NONE, DRAFT, PUBLISHED]
    MyCallUp:
      type: string
      enum: [NO_CALL_UP_YET, CALLED_UP, NOT_CALLED_UP]
    AttendanceStatus:
      type: string
      description: «anwesend», «abwesend», «entschuldigt» (PRS-03)
      enum: [PRESENT, ABSENT, EXCUSED]
    MatchSource:
      type: string
      enum: [MANUAL, SWISS_UNIHOCKEY]

    PersonSummary:
      type: object
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, examples: [Anna] }
        lastName: { type: string, examples: [Muster] }
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          required: [admin]
          properties:
            email: { type: [string, 'null'], format: email }
            admin: { type: boolean }
    PersonInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: [string, 'null'], format: email }
        admin:
          type: boolean
          description: Only admins change it. Missing means «no admin» for admins and «unchanged» for coaches (RR-04, E-69).
    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required: [memberships]
          properties:
            memberships:
              type: array
              items: { $ref: '#/components/schemas/TeamMembership' }
    Me:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required: [coach, season, memberships, now]
          properties:
            coach:
              type: boolean
              description: Coach of at least one team in the current season. Coaches manage all teams like admins, but do not delete (RR-03, RR-08, E-69).
            season: { $ref: '#/components/schemas/Season' }
            memberships:
              type: array
              items: { $ref: '#/components/schemas/TeamMembership' }
            now:
              type: string
              format: date-time
              description: Time of the backend clock when loading, e.g. for «show the year only if it is not the current one» (F-03)
    Session:
      type: object
      required: [signedIn]
      properties:
        signedIn: { type: boolean }
    Tile:
      type: object
      required: [id, title, icon, route, color]
      properties:
        id: { type: string, examples: [anwesenheit] }
        title: { type: string, examples: [Anwesenheit] }
        icon: { type: string, description: Lucide icon name, examples: [calendar-check] }
        route: { type: string, examples: [/termine] }
        color:
          type: string
          enum: [primary, blue, mustard, coral]
        hint: { type: [string, 'null'], description: 'Short status, e.g. «2 offen»' }

    TestPerson:
      type: object
      description: Seed person with key from docs/test-data.md. Only profiles dev and test.
      required: [loginKey, id, firstName, lastName, admin, teams]
      properties:
        loginKey: { type: string, examples: [petra] }
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        admin: { type: boolean }
        teams:
          type: array
          description: Teams of the current season, by team name
          items: { $ref: '#/components/schemas/TestPersonTeam' }
    TestPersonTeam:
      type: object
      required: [teamId, teamName, teamRole]
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        teamRole: { $ref: '#/components/schemas/TeamRole' }
    DataSet:
      type: string
      description: >-
        TEST the fixed seed with simulators and a fixed clock; CLUB the club with its real teams, live data from
        swiss unihockey and the running clock (docs/test-data.md)
      enum: [TEST, CLUB]
    DataSetState:
      type: object
      required: [dataset, simulated, loading, routing]
      properties:
        dataset: { $ref: '#/components/schemas/DataSet' }
        simulated: { type: boolean, description: swiss unihockey and routing are simulated }
        loading: { type: boolean, description: The club data is still being loaded from swiss unihockey }
        routing:
          type: string
          description: 'Which service calculates routes: SIMULATOR, GOOGLE, OPEN_ROUTE_SERVICE or OPEN_STREET_MAP'
    SuClubPreset:
      type: object
      properties:
        teams:
          type: [array, 'null']
          description: 'Teams of the club the simulator lists; omitted: they stay as they are'
          items: { $ref: '#/components/schemas/SuClubTeamInput' }
        unavailable:
          type: [boolean, 'null']
          default: false
          description: Simulates an outage of the team list (SUH-09)
    SuClubTeamInput:
      type: object
      required: [suTeamId, name]
      properties:
        suTeamId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1 }

    Season:
      type: object
      required: [id, name, startDate, endDate, current, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [2026/27] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        current: { type: boolean }
        archived:
          type: boolean
          description: Season before the current one. Read-only (SAI-02).
    NewSeason:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 20, examples: [2027/28] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        copyFrom:
          type: [string, 'null']
          format: uuid
          description: Season whose teams, memberships and lines are carried over (SAI-04)

    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Team 1] }
        suTeamId:
          type: [integer, 'null']
          description: Team ID at swiss unihockey in this season; with several links the first one (SUH-11)
          examples: [900001]
        myTeamRole:
          oneOf:
            - $ref: '#/components/schemas/TeamRole'
            - type: 'null'
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    TeamDetail:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          required: [coaches, lineup]
          properties:
            coaches:
              type: array
              items: { $ref: '#/components/schemas/PersonSummary' }
            lineup: { $ref: '#/components/schemas/Lineup' }
            warningMinimums:
              $ref: '#/components/schemas/WarningMinimums'
              description: Only for coaches and admins (F-16)
            matchDaySettings:
              $ref: '#/components/schemas/MatchDaySettings'
              description: Only for coaches and admins (TML-02)
    MatchDaySettings:
      type: object
      description: >-
        Match day settings of a team (TML-02, TML-03, AUF-32). Defaults: a match takes 50 minutes, arrival 70
        minutes before the first match, no usual meeting point.
      required: [matchDurationMinutes, arrivalLeadMinutes]
      properties:
        matchDurationMinutes: { type: integer, format: int32, minimum: 10, maximum: 240, examples: [50] }
        arrivalLeadMinutes: { type: integer, format: int32, minimum: 0, maximum: 240, examples: [70] }
        meetingPoint:
          type: [string, 'null']
          maxLength: 120
          description: Usual meeting point; new match days from swiss unihockey start with it
          examples: [Oberstufenschulhaus Beromünster]
    WarningMinimums:
      type: object
      description: >-
        Minimums of a team for the warnings (F-16). Defaults 1 goalie, 10 field players for match days, 6 for
        practices, 3 per line. 0 switches the warning off.
      required: [goalies, fieldPlayersMatchDay, fieldPlayersPractice, perLine]
      properties:
        goalies: { type: integer, minimum: 0, maximum: 99, examples: [1] }
        fieldPlayersMatchDay: { type: integer, minimum: 0, maximum: 99, examples: [10] }
        fieldPlayersPractice: { type: integer, minimum: 0, maximum: 99, examples: [6] }
        perLine: { type: integer, minimum: 0, maximum: 99, examples: [3] }
    WarningType:
      type: string
      description: >-
        GOALIES fewer goalies than the minimum («Kein Goalie angemeldet»), FIELD_PLAYERS fewer field players (all
        players outside the goalies, including «Ohne Linie»), LINE a line with at least one but fewer players than
        the line minimum («Linie 2 nur zu 1»), MATCH_CHANGED `count` matches changed by swiss unihockey and not
        confirmed yet, MATCH_MISSING `count` matches swiss unihockey no longer delivers (SUH-12; both belong to
        the match day, `minimum` is 0)
      enum: [GOALIES, FIELD_PLAYERS, LINE, MATCH_CHANGED, MATCH_MISSING]
    Warning:
      type: object
      description: >-
        A warning for one team of the event (F-16). Counts players with «dabei» (overview) or the selected
        players (call-up). The frontend builds the German text from it.
      required: [type, team, count, minimum]
      properties:
        type: { $ref: '#/components/schemas/WarningType' }
        team:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        groupId: { type: string, format: uuid, description: Only for LINE }
        groupName: { type: string, description: Only for LINE, examples: [Linie 2] }
        count: { type: integer, minimum: 0 }
        minimum: { type: integer, minimum: 1 }
    TeamMembership:
      type: object
      required: [team, person, teamRole, seasonId]
      properties:
        team:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        person: { $ref: '#/components/schemas/PersonSummary' }
        teamRole: { $ref: '#/components/schemas/TeamRole' }
        seasonId: { type: string, format: uuid }
        groupId:
          type: [string, 'null']
          format: uuid
          description: Only for team role PLAYER
    MemberInput:
      type: object
      required: [personId, teamRole]
      properties:
        personId: { type: string, format: uuid }
        teamRole: { $ref: '#/components/schemas/TeamRole' }

    Group:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/GroupType' }
        name: { type: string, examples: [Linie 1] }
        sortOrder: { type: [integer, 'null'], description: Only for LINE }
    LineInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        sortOrder: { type: integer, minimum: 1 }
    Lineup:
      type: object
      description: All groups of a team in display order, including empty ones
      required: [groups, noLine]
      properties:
        groups:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Group'
              - type: object
                required: [players]
                properties:
                  players:
                    type: array
                    items: { $ref: '#/components/schemas/PersonSummary' }
        noLine:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }

    Location:
      type: object
      required: [name]
      properties:
        name: { type: string, examples: [Sporthalle Seefeld, Musterdorf] }
        address: { type: [string, 'null'] }
        mapsUrl:
          type: [string, 'null']
          format: uri
          description: Google Maps link (AUF-10). Must start with https://.
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    MeetingPoint:
      type: object
      description: >-
        Where and when the team meets (AUF-12). The time can still be open (`null`): match days from swiss
        unihockey start with the usual meeting point of the team (AUF-32), the timeline suggests a departure
        (TML-04).
      required: [location]
      properties:
        time: { type: [string, 'null'], format: date-time }
        location: { type: string, examples: [Parkplatz Sporthalle Nord] }
    Counts:
      type: object
      required: [attending, declined, maybe, pending]
      properties:
        attending: { type: integer, minimum: 0 }
        declined: { type: integer, minimum: 0 }
        maybe: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }

    EventSummary:
      type: object
      required: [id, type, title, start, end, status, teams, responseDeadline, myResponse]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EventType' }
        title: { type: string, examples: [Training] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EventStatus' }
        cancellationReason: { type: [string, 'null'] }
        rescheduled: { type: boolean, default: false }
        teams:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Team' }
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        responseDeadline: { type: string, format: date-time }
        myResponse: { $ref: '#/components/schemas/Response' }
        counts:
          $ref: '#/components/schemas/Counts'
          description: Total counts of players
        seriesId: { type: [string, 'null'], format: uuid }
        warningCount:
          type: integer
          minimum: 0
          description: >-
            Only for coaches and admins (F-16): number of warnings from the responses, as in the overview. 0 for
            past, cancelled and other events
    Event:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            notes: { type: [string, 'null'], examples: [Weisse Trikots mitnehmen] }
            responseDeadlineHours: { type: integer, minimum: 0 }
            meetingPoint:
              oneOf:
                - $ref: '#/components/schemas/MeetingPoint'
                - type: 'null'
            matches:
              type: array
              description: Only for MATCH_DAY, sorted by start time
              items: { $ref: '#/components/schemas/Match' }
            callUpStatus:
              $ref: '#/components/schemas/CallUpStatus'
              description: Only for MATCH_DAY. Anyone who is not a coach of the team or an admin sees NONE before publishing (AUF-23).
            myCallUp:
              oneOf:
                - $ref: '#/components/schemas/MyCallUp'
                - type: 'null'
              description: Only for MATCH_DAY and team role PLAYER
            canEdit: { type: boolean, description: For showing coach actions }
            attendanceCheck: { type: boolean, description: 'Switch «Präsenz erfassen» (PRS-01)' }
            attendanceRecorded:
              type: boolean
              description: Only for coaches and admins. Attendance has been saved (PRS-08), also while the check is off.
            canRecordAttendance:
              type: boolean
              description: Coach or admin, check on, not cancelled, started, season not archived (PRS-02)
            myAttendance:
              oneOf:
                - $ref: '#/components/schemas/AttendanceStatus'
                - type: 'null'
              description: Own recorded attendance; only for team role PLAYER, with the check on and a recorded value (PRS-06)
    EventInput:
      type: object
      required: [type, title, start, end, teamIds]
      properties:
        type: { $ref: '#/components/schemas/EventType' }
        title: { type: string, minLength: 1, maxLength: 80 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        teamIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 500 }
        responseDeadlineHours: { type: integer, minimum: 0, maximum: 336, default: 24, description: 'Hours before the start (TER-09, TER-10)' }
        meetingPoint:
          oneOf:
            - $ref: '#/components/schemas/MeetingPoint'
            - type: 'null'
        attendanceCheck:
          type: boolean
          description: 'Switch «Präsenz erfassen» (PRS-01). Missing: off for a new event, unchanged for an existing one.'

    Series:
      allOf:
        - $ref: '#/components/schemas/SeriesInput'
        - type: object
          required: [id, teams, exceptions]
          properties:
            id: { type: string, format: uuid }
            teams:
              type: array
              minItems: 1
              description: All teams of the series by name, with the name in the season of the series (TER-11)
              items: { $ref: '#/components/schemas/Team' }
            exceptions:
              type: array
              items: { $ref: '#/components/schemas/SeriesException' }
    SeriesInput:
      type: object
      required: [type, title, teamIds, weekday, startTime, endTime, validFrom, validUntil]
      properties:
        type:
          type: string
          enum: [PRACTICE, OTHER]
        title: { type: string, minLength: 1, maxLength: 80, examples: [Training] }
        teamIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        weekday:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['18:30'] }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['20:00'] }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        responseDeadlineHours: { type: integer, minimum: 0, maximum: 336, default: 24, description: 'Hours before the start (TER-09, TER-10)' }
        attendanceCheck:
          type: boolean
          description: 'Switch «Präsenz erfassen» for all events of the series (PRS-01). Missing: off for a new series, unchanged for an existing one.'
    SeriesException:
      type: object
      required: [startDate, endDate, reason]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 200, examples: [Weihnachtsferien] }

    Response:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ResponseStatus' }
        comment:
          type: [string, 'null']
          description: Only visible to the person themselves and the coaches of the team (ANM-07), otherwise not included
        changedAt: { type: [string, 'null'], format: date-time }
        enteredBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
          description: Set if entered on behalf of the person (ANM-12)
        lateCancellation:
          type: boolean
          default: false
          description: Changed to `DECLINED` or `MAYBE` after the response deadline (ANM-10)
    ResponseInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ATTENDING, DECLINED, MAYBE]
        comment:
          type: [string, 'null']
          maxLength: 200
          description: Required for MAYBE (ANM-04), optional for DECLINED (ANM-05)

    Overview:
      type: object
      required: [eventId, total, teams, coaches]
      properties:
        warnings:
          type: array
          description: >-
            Only for coaches and admins (F-16), missing for everyone else. Empty for past, cancelled and other
            events. By team, then goalies, field players, lines.
          items: { $ref: '#/components/schemas/Warning' }
        eventId: { type: string, format: uuid }
        total:
          $ref: '#/components/schemas/Counts'
          description: Each player once, even if she is in several teams (ANM-32)
        teams:
          type: array
          description: Sorted by team name
          items: { $ref: '#/components/schemas/OverviewTeam' }
        coaches:
          type: array
          description: Coach block (ANM-22)
          items:
            type: object
            required: [person, team, response]
            properties:
              person: { $ref: '#/components/schemas/PersonSummary' }
              team:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
              response: { $ref: '#/components/schemas/Response' }
    OverviewTeam:
      type: object
      required: [team, counts, groups]
      properties:
        team:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        counts: { $ref: '#/components/schemas/Counts' }
        groups:
          type: array
          description: Lines by sort order, then goalies, then «Ohne Linie» (no line). Empty groups are left out.
          items:
            type: object
            required: [type, name, entries]
            properties:
              groupId:
                type: [string, 'null']
                format: uuid
                description: '`null` for «Ohne Linie» (no line)'
              type:
                type: string
                enum: [LINE, GOALIES, NO_LINE]
              name: { type: string, examples: [Linie 1, Goalies, Ohne Linie] }
              entries:
                type: array
                description: By last name, then first name
                items:
                  type: object
                  required: [person, response]
                  properties:
                    person: { $ref: '#/components/schemas/PersonSummary' }
                    response: { $ref: '#/components/schemas/Response' }

    Match:
      type: object
      required: [id, opponent, startTime, home, source]
      properties:
        id: { type: string, format: uuid }
        opponent: { type: string, examples: [UHC Musterdorf] }
        startTime: { type: string, format: date-time }
        home: { type: boolean }
        result: { type: [string, 'null'], pattern: '^\d{1,2}:\d{1,2}$', examples: ['5:3'] }
        source: { $ref: '#/components/schemas/MatchSource' }
        suMatchId: { type: [integer, 'null'] }
        missingAtSu:
          type: boolean
          default: false
          description: swiss unihockey no longer delivers the match. It is not deleted automatically.
        suChange:
          description: Unconfirmed change by swiss unihockey (SUH-12); `null` if there is none
          oneOf:
            - $ref: '#/components/schemas/SuChange'
            - type: 'null'
    SuChange:
      type: object
      description: >-
        What swiss unihockey changed about an imported match since a coach or admin last confirmed it (SUH-12).
        The change itself is already applied; `changes` holds the values before and after as texts for display.
      required: [changedAt, changes]
      properties:
        changedAt: { type: string, format: date-time }
        changes:
          type: array
          items: { $ref: '#/components/schemas/SuChangeItem' }
    SuChangeItem:
      type: object
      required: [field, before, after]
      properties:
        field: { $ref: '#/components/schemas/SuChangeField' }
        before: { type: string, examples: ['So 22.11. 09:30'] }
        after: { type: string, examples: ['So 22.11. 10:15'] }
    SuChangeField:
      type: string
      enum: [START_TIME, VENUE, OPPONENT, HOME_AWAY]
    Timeline:
      type: object
      description: Timeline of a match day (TML). Times that cannot be worked out are missing; `hints` says why.
      required: [eventId, cancelled, hints, departureSuggested, matchDurationMinutes, arrivalLeadMinutes, coolDownMinutes, canApplySuggestion, items]
      properties:
        eventId: { type: string, format: uuid }
        cancelled: { type: boolean }
        hints:
          type: array
          items: { $ref: '#/components/schemas/TimelineHint' }
        departure:
          type: string
          format: date-time
          description: 'When the team leaves: the meeting time, otherwise the suggestion'
        departureSuggested:
          type: boolean
          description: The departure is the suggestion; no meeting time is set yet (TML-04)
        suggestedDeparture:
          type: string
          format: date-time
          description: Arrival target minus driving time, rounded down to five minutes (TML-04)
        arriveBy:
          type: string
          format: date-time
          description: 'When the team wants to be at the venue: first match minus the arrival lead (TML-03)'
        driveMinutes: { type: integer, format: int32, description: Driving time from the meeting point to the venue }
        distanceKm: { type: number, format: double, description: One-way distance }
        matchDurationMinutes: { type: integer, format: int32 }
        arrivalLeadMinutes: { type: integer, format: int32 }
        coolDownMinutes: { type: integer, format: int32, examples: [20] }
        canApplySuggestion:
          type: boolean
          description: Coach or admin can take over the suggestion as meeting time right now
        items:
          type: array
          items: { $ref: '#/components/schemas/TimelineItem' }
    TimelineHint:
      type: string
      description: >-
        NO_MATCHES the match day has no matches yet; MEETING_POINT_MISSING no meeting point, so no departure,
        arrival or return; DRIVE_TIME_UNKNOWN meeting point and venue are set but there is no driving time (no
        route found, service unavailable, kilometres entered by hand); ARRIVES_LATE with the set meeting time the
        team arrives later than its arrival lead wants
      enum: [NO_MATCHES, MEETING_POINT_MISSING, DRIVE_TIME_UNKNOWN, ARRIVES_LATE]
    TimelineItem:
      type: object
      description: A line of the timeline. `end` and `minutes` only for spans; the match fields only for a match.
      required: [kind, start]
      properties:
        kind: { $ref: '#/components/schemas/TimelineKind' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        minutes: { type: integer, format: int32 }
        matchId: { type: string, format: uuid }
        opponent: { type: string }
        home: { type: boolean }
    TimelineKind:
      type: string
      description: >-
        Kind of a line of the timeline: DEPARTURE the team leaves the meeting point (`minutes`: driving time),
        ARRIVAL at the venue, WARM_UP time before the first match, MATCH, BREAK between two matches, COOL_DOWN
        after the last match, RETURN approximate return at the meeting point (`minutes`: driving time)
      enum: [DEPARTURE, ARRIVAL, WARM_UP, MATCH, BREAK, COOL_DOWN, RETURN]
    MatchInput:
      type: object
      required: [opponent, startTime, home]
      properties:
        opponent: { type: string, minLength: 1, maxLength: 80 }
        startTime: { type: string, format: date-time }
        home: { type: boolean }
        result: { type: [string, 'null'], pattern: '^\d{1,2}:\d{1,2}$' }

    CallUp:
      type: object
      required: [eventId, status, groups, warnings]
      properties:
        warnings:
          type: array
          description: Warnings from the selected players (F-16). Empty for past and cancelled match days.
          items: { $ref: '#/components/schemas/Warning' }
        eventId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CallUpStatus' }
        publishedAt: { type: [string, 'null'], format: date-time }
        calledUpCount: { type: integer, minimum: 0 }
        groups:
          type: array
          description: All players of the team, grouped as in the overview, including those without a response (AUF-21, AUF-22)
          items:
            type: object
            required: [type, name, entries]
            properties:
              groupId: { type: [string, 'null'], format: uuid }
              type:
                type: string
                enum: [LINE, GOALIES, NO_LINE]
              name: { type: string }
              entries:
                type: array
                items:
                  type: object
                  required: [person, response, calledUp]
                  properties:
                    person: { $ref: '#/components/schemas/PersonSummary' }
                    response: { $ref: '#/components/schemas/Response' }
                    calledUp: { type: boolean }

    Attendance:
      type: object
      required: [eventId, recorded, teams]
      properties:
        eventId: { type: string, format: uuid }
        recorded: { type: boolean, description: Attendance has been saved at least once (PRS-04) }
        recordedAt: { type: [string, 'null'], format: date-time, description: Last save }
        recordedBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
          description: Who saved last (PRS-04)
        teams:
          type: array
          description: >-
            All players of the involved teams by team (sorted by name) and line, as in the overview; teams without
            players are left out. A player in two teams appears in both. Coaches are not part of it (PRS-03, PRS-05)
          items:
            type: object
            required: [team, groups]
            properties:
              team:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
              groups:
                type: array
                items:
                  type: object
                  required: [type, name, entries]
                  properties:
                    groupId: { type: [string, 'null'], format: uuid }
                    type:
                      type: string
                      enum: [LINE, GOALIES, NO_LINE]
                    name: { type: string }
                    entries:
                      type: array
                      items:
                        type: object
                        required: [person, response, status, recorded]
                        properties:
                          person: { $ref: '#/components/schemas/PersonSummary' }
                          response: { $ref: '#/components/schemas/Response' }
                          status: { $ref: '#/components/schemas/AttendanceStatus' }
                          recorded: { type: boolean, description: 'false: the status is the preselection from the response' }
    AttendanceInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [personId, status]
            properties:
              personId: { type: string, format: uuid }
              status: { $ref: '#/components/schemas/AttendanceStatus' }

    StatisticsTeam:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 'Name in the season' }
    StatisticsSeason:
      type: object
      required: [id, name, startDate, endDate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [2026/27] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    PlayerStatistics:
      type: object
      description: >-
        Numbers of one player in one team (STA-03, STA-04). Rates in whole percent (half up), null without a base.
      required: [person, joinedOn, events, attending, declined, maybe, pending, lateCancellations, attendanceEvents,
                 present, absent, excused]
      properties:
        person: { $ref: '#/components/schemas/PersonSummary' }
        joinedOn: { type: string, format: date, description: 'Day she joined the team; counts from here on (STA-07)' }
        events: { type: integer, description: 'Events that count for her' }
        attending: { type: integer, description: '«dabei»' }
        declined: { type: integer, description: '«nicht dabei»' }
        maybe: { type: integer, description: '«vielleicht»' }
        pending: { type: integer, description: '«offen»' }
        attendingRate: { type: [integer, 'null'], description: 'Share of «dabei» of `events`' }
        lateCancellations: { type: integer, description: 'Late cancellations (ANM-10)' }
        attendanceEvents: { type: integer, description: 'Events with recorded attendance for her, the base of `attendanceRate`' }
        present: { type: integer, description: '«anwesend»' }
        absent: { type: integer, description: '«abwesend»' }
        excused: { type: integer, description: '«entschuldigt»' }
        attendanceRate: { type: [integer, 'null'], description: 'Share of «anwesend» of `attendanceEvents`' }
    StatisticsAverage:
      type: object
      description: Team average (STA-05) per player; counts with one decimal, rates as mean of the players that have one
      required: [events, attending, declined, maybe, pending, lateCancellations, present, absent, excused]
      properties:
        events: { type: number }
        attending: { type: number }
        declined: { type: number }
        maybe: { type: number }
        pending: { type: number }
        attendingRate: { type: [integer, 'null'] }
        lateCancellations: { type: number }
        present: { type: number }
        absent: { type: number }
        excused: { type: number }
        attendanceRate: { type: [integer, 'null'] }
    TeamStatistics:
      type: object
      required: [teams, season, from, to, events, attendanceEvents, groups]
      properties:
        team:
          oneOf:
            - $ref: '#/components/schemas/StatisticsTeam'
            - type: 'null'
          description: Chosen team; null if the season has no team
        teams:
          type: array
          description: All teams of the season by name, for the choice
          items: { $ref: '#/components/schemas/StatisticsTeam' }
        season: { $ref: '#/components/schemas/StatisticsSeason' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        type:
          oneOf:
            - $ref: '#/components/schemas/EventType'
            - type: 'null'
          description: Chosen event type; null = all
        events: { type: integer, description: 'Events of the team that count in the period' }
        attendanceEvents: { type: integer, description: 'Of them, events with recorded attendance (STA-04)' }
        groups:
          type: array
          description: Lines by order, then goalies, then «Ohne Linie»; empty groups are left out (STA-05)
          items:
            type: object
            required: [type, name, players]
            properties:
              groupId: { type: [string, 'null'], format: uuid }
              type:
                type: string
                enum: [LINE, GOALIES, NO_LINE]
              name: { type: string }
              players:
                type: array
                description: By last name, then first name
                items: { $ref: '#/components/schemas/PlayerStatistics' }
        average:
          oneOf:
            - $ref: '#/components/schemas/StatisticsAverage'
            - type: 'null'
          description: Null without players
    PersonStatistics:
      type: object
      required: [person, teams, season, from, to, events]
      properties:
        person: { $ref: '#/components/schemas/PersonSummary' }
        team:
          oneOf:
            - $ref: '#/components/schemas/StatisticsTeam'
            - type: 'null'
        teams:
          type: array
          description: Teams in which the person is a player in the season, by name
          items: { $ref: '#/components/schemas/StatisticsTeam' }
        season: { $ref: '#/components/schemas/StatisticsSeason' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        type:
          oneOf:
            - $ref: '#/components/schemas/EventType'
            - type: 'null'
        statistics:
          oneOf:
            - $ref: '#/components/schemas/PlayerStatistics'
            - type: 'null'
        events:
          type: array
          description: Events that count for her, newest first (STA-06)
          items:
            type: object
            required: [id, type, title, start, response, lateCancellation]
            properties:
              id: { type: string, format: uuid }
              type: { $ref: '#/components/schemas/EventType' }
              title: { type: string }
              start: { type: string, format: date-time }
              response: { $ref: '#/components/schemas/ResponseStatus' }
              lateCancellation: { type: boolean }
              attendance:
                oneOf:
                  - $ref: '#/components/schemas/AttendanceStatus'
                  - type: 'null'
                description: Only where attendance is recorded for her

    SuConnection:
      type: object
      description: Links of a team to swiss unihockey in the current season (SUH-02, SUH-11)
      required: [teamId, teamName, canManage, links]
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        canManage: { type: boolean, description: 'Coach or admin: may link, unlink and sync' }
        links:
          type: array
          description: The oldest first; the first one feeds the league page (F-17)
          items: { $ref: '#/components/schemas/SuLink' }
    SuLink:
      type: object
      required: [id, suTeamId]
      properties:
        id: { type: string, format: uuid }
        suTeamId: { type: integer, format: int32, examples: [428361] }
        name: { type: [string, 'null'], description: 'Name at swiss unihockey, e.g. «Damen KF 1. Liga»' }
        lastSyncAt: { type: [string, 'null'], format: date-time, description: 'Time of the last sync; `null`: never synced' }
        lastSyncOk: { type: [boolean, 'null'], description: '`false`: the last sync failed (SUH-13)' }
        lastSyncError: { type: [string, 'null'], description: 'German sentence about the failure, for display' }
    SuLinkInput:
      type: object
      required: [suTeamId]
      properties:
        suTeamId: { type: integer, format: int32, minimum: 1, examples: [428361] }
        name:
          type: [string, 'null']
          maxLength: 120
          description: 'Name at swiss unihockey; omitted: looked up in the club''s teams'
    SuClubTeam:
      type: object
      description: A team of the club at swiss unihockey, for the link dialog (SUH-02)
      required: [suTeamId, name]
      properties:
        suTeamId: { type: integer, format: int32 }
        name: { type: string, examples: [Damen KF 1. Liga] }
        linkedTeamId: { type: [string, 'null'], format: uuid, description: Team of the app it is linked with this season }
        linkedTeamName: { type: [string, 'null'] }
    SuStatus:
      type: object
      description: How the connection to swiss unihockey is doing (SUH-13)
      required: [linkedTeams, failures]
      properties:
        linkedTeams: { type: integer, format: int32, description: Teams of the current season with at least one link }
        lastSyncAt: { type: [string, 'null'], format: date-time, description: Time of the last successful sync of any team }
        failures:
          type: array
          description: Links whose last sync failed, by team name
          items: { $ref: '#/components/schemas/SuSyncFailure' }
    SuSyncFailure:
      type: object
      required: [teamId, teamName, suTeamId, at, message]
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        suTeamId: { type: integer, format: int32 }
        suTeamName: { type: [string, 'null'] }
        at: { type: string, format: date-time }
        message: { type: string }
    SyncResult:
      type: object
      required: [created, changed, missing, unchanged]
      properties:
        created: { type: integer, description: Newly created matches }
        changed: { type: integer }
        missing: { type: integer }
        unchanged: { type: integer }
        affectedEvents:
          type: array
          items: { type: string, format: uuid }
    SuMatch:
      type: object
      description: Simplified form of a match as the simulator delivers it
      required: [suMatchId, startTime, homeTeam, awayTeam, hall]
      properties:
        suMatchId: { type: integer, examples: [5000002] }
        startTime: { type: string, format: date-time }
        homeTeam: { type: string }
        awayTeam: { type: string }
        hall: { type: string, examples: [Sporthalle Seefeld] }
        location: { type: [string, 'null'], examples: [Musterdorf] }
        mapsUrl: { type: [string, 'null'], format: uri }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        result: { type: [string, 'null'] }

    SuLeague:
      type: object
      description: League view the simulator delivers (F-17)
      required: [table]
      properties:
        league: { type: [string, 'null'], examples: [Herren Kleinfeld 3. Liga] }
        group: { type: [string, 'null'], examples: [Gruppe 12] }
        table:
          type: array
          items: { $ref: '#/components/schemas/SuStanding' }
        matches:
          type: [array, 'null']
          description: Matches of the league view; without them the matches of the sync
          items: { $ref: '#/components/schemas/SuMatch' }
    SuStanding:
      type: object
      description: A table row. `suTeamId` equal to the linked team ID marks the own team
      required: [rank, team, matches, wins, draws, losses, goalsFor, goalsAgainst, points]
      properties:
        rank: { type: integer, minimum: 1 }
        suTeamId: { type: [integer, 'null'], examples: [900001] }
        team: { type: string, examples: [UHC Musterdorf] }
        matches: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        draws: { type: integer, minimum: 0 }
        losses: { type: integer, minimum: 0 }
        goalsFor: { type: integer, minimum: 0 }
        goalsAgainst: { type: integer, minimum: 0 }
        points: { type: integer }

    League:
      type: object
      description: League data of a team from the cache (F-17)
      required: [teamId, teamName, linked, table, upcoming, results]
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string, examples: [Team 1] }
        linked: { type: boolean, description: Linked with swiss unihockey; otherwise all other fields are empty }
        league: { type: [string, 'null'], examples: [Herren Kleinfeld 3. Liga] }
        group: { type: [string, 'null'], examples: [Gruppe 12] }
        loadedAt:
          type: [string, 'null']
          format: date-time
          description: Last successful load («Stand»), `null` if never loaded in this season
        failedAt:
          type: [string, 'null']
          format: date-time
          description: Last failed attempt after `loadedAt` (SUH-09), `null` if the last attempt worked
        table:
          type: array
          items: { $ref: '#/components/schemas/LeagueRow' }
        upcoming:
          type: array
          description: «Kommende Spiele», earliest first, at most five
          items: { $ref: '#/components/schemas/LeagueMatch' }
        results:
          type: array
          description: «Letzte Resultate», latest first, at most five
          items: { $ref: '#/components/schemas/LeagueMatch' }
    LeagueRow:
      type: object
      required: [rank, team, matches, wins, draws, losses, goalsFor, goalsAgainst, points, own]
      properties:
        rank: { type: integer }
        team: { type: string }
        matches: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        goalsFor: { type: integer }
        goalsAgainst: { type: integer }
        points: { type: integer }
        own: { type: boolean, description: The own team (criterion 2) }
    LeagueMatch:
      type: object
      required: [suMatchId, startTime, homeTeam, awayTeam, opponent, home, hall]
      properties:
        suMatchId: { type: integer }
        startTime: { type: string, format: date-time }
        homeTeam: { type: string }
        awayTeam: { type: string }
        opponent: { type: string, description: From the view of the own team }
        home: { type: boolean, description: Home match of the own team }
        hall: { type: string }
        location: { type: [string, 'null'] }
        result: { type: [string, 'null'], description: 'home:away, e.g. 5:3' }
        eventId:
          type: [string, 'null']
          format: uuid
          description: The match day in the app the match belongs to (criterion 3)

    DriverList:
      type: object
      description: Driver list of a match day (DRV-01 to DRV-10)
      required: [eventId, ready, missing, cancelled, canJoin, canManage, callUpPublished, cars, withoutSeat]
      properties:
        eventId: { type: string, format: uuid }
        ready:
          type: boolean
          description: Meeting point and venue are set, so the list can be used (DRV-01)
        missing:
          type: array
          description: What is missing before the list can be used (DRV-01)
          items:
            type: string
            enum: [MEETING_POINT, VENUE]
        route: { $ref: '#/components/schemas/Route' }
        cancelled:
          type: boolean
          description: 'Match day cancelled: list kept, no credits (DRV-10)'
        canJoin:
          type: boolean
          description: The caller can enter herself as driver or passenger right now
        canManage:
          type: boolean
          description: 'Coach or admin: enters and changes drivers and passengers for others, route by hand'
        callUpPublished:
          type: boolean
          description: 'The call-up is published: «without seat» counts the called-up players (DRV-04)'
        cars:
          type: array
          description: By name of the driver
          items: { $ref: '#/components/schemas/Car' }
        withoutSeat:
          type: array
          description: Called-up players (or «dabei» without published call-up) without a seat, by name (DRV-04)
          items: { $ref: '#/components/schemas/PersonSummary' }
        members:
          type: array
          description: Members of the teams of the match day, by name; only for coaches and admins
          items: { $ref: '#/components/schemas/PersonSummary' }

    Car:
      type: object
      description: A car with its driver and passengers (DRV-02, DRV-03)
      required: [id, driver, seats, freeSeats, passengers]
      properties:
        id: { type: string, format: uuid }
        driver: { $ref: '#/components/schemas/PersonSummary' }
        seats: { type: integer, format: int32, minimum: 1, maximum: 8 }
        freeSeats: { type: integer, format: int32 }
        passengers:
          type: array
          description: By name
          items: { $ref: '#/components/schemas/PersonSummary' }
        creditKm:
          type: [number, 'null']
          format: double
          description: Credited kilometres for the return trip; missing without distance or if cancelled (DRV-05, DRV-10)

    Route:
      type: object
      description: Route from the meeting point to the venue (DRV-05, DRV-07)
      required: [status, from, to]
      properties:
        status:
          type: string
          enum: [CALCULATED, NOT_FOUND, UNAVAILABLE, MANUAL]
        from: { type: string, examples: [Parkplatz Sporthalle Nord] }
        to: { type: string, examples: [Sporthalle Seefeld] }
        distanceKm: { type: number, format: double, examples: [23.4] }
        durationMinutes: { type: integer, format: int32, examples: [26] }
        creditKm:
          type: number
          format: double
          description: 'Credit per driver: twice the distance; missing without distance'
          examples: [46.8]

    CarInput:
      type: object
      description: 'Enter a car (DRV-02): for oneself without `driverId`, for someone else only as coach or admin'
      required: [seats]
      properties:
        driverId:
          type: [string, 'null']
          format: uuid
          description: 'Driver; missing: the caller herself'
        seats: { type: integer, format: int32, minimum: 1, maximum: 8 }

    SeatsInput:
      type: object
      required: [seats]
      properties:
        seats: { type: integer, format: int32, minimum: 1, maximum: 8 }

    RouteInput:
      type: object
      description: Kilometres of the one-way route entered by hand (DRV-07)
      required: [distanceKm]
      properties:
        distanceKm: { type: number, format: double, minimum: 0.1, maximum: 1000 }

    DriverPlan:
      type: object
      description: Driver plan of a team for a whole season (DRV-14, DRV-17)
      required: [teamId, teamName, seasonId, seasonName, canJoin, canManage, matchDays, shares]
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        seasonId: { type: string, format: uuid }
        seasonName: { type: string, examples: [2026/27] }
        canJoin: { type: boolean, description: The caller is a member of the team and can enter herself as driver }
        canManage: { type: boolean, description: 'Coach or admin: enters drivers for others' }
        matchDays:
          type: array
          description: Match days of the team in the season, by start
          items: { $ref: '#/components/schemas/DriverPlanMatchDay' }
        shares:
          type: array
          description: Trips per member of the team, by name (DRV-17)
          items: { $ref: '#/components/schemas/DriverShare' }
        members:
          type: array
          description: Members of the team, by name; only for coaches and admins
          items: { $ref: '#/components/schemas/PersonSummary' }
    DriverPlanMatchDay:
      type: object
      required: [eventId, title, start, cancelled, over, ready, missing, changeable, cars, freeSeats]
      properties:
        eventId: { type: string, format: uuid }
        title: { type: string }
        start: { type: string, format: date-time }
        venue: { type: string, description: Name of the venue }
        town: { type: string, description: Town of the venue }
        cancelled: { type: boolean }
        over: { type: boolean, description: The match day is over }
        ready: { type: boolean, description: 'Meeting point and venue are set, so drivers can be entered (DRV-01)' }
        missing:
          type: array
          items:
            type: string
            enum: [MEETING_POINT, VENUE]
        distanceKm: { type: number, format: double, description: 'One-way distance, if a route is known' }
        durationMinutes: { type: integer, format: int32 }
        changeable: { type: boolean, description: Drivers can be entered right now by the caller }
        cars:
          type: array
          items: { $ref: '#/components/schemas/Car' }
        freeSeats: { type: integer, format: int32, description: Free seats in all cars }
    DriverShare:
      type: object
      description: How often a member drives in the season (DRV-17), done and planned
      required: [person, trips, plannedTrips, kilometres, plannedKilometres]
      properties:
        person: { $ref: '#/components/schemas/PersonSummary' }
        trips: { type: integer, format: int32, description: Trips on match days that are over }
        plannedTrips: { type: integer, format: int32, description: Trips on upcoming match days }
        kilometres: { type: number, format: double, description: Credited kilometres of the trips that are over }
        plannedKilometres: { type: number, format: double, description: Kilometres of the planned trips with a known distance }
    DriverPlanInput:
      type: object
      required: [seats, eventIds]
      properties:
        driverId:
          type: [string, 'null']
          format: uuid
          description: 'Driver; missing: the caller herself'
        seats: { type: integer, format: int32, minimum: 1, maximum: 8 }
        eventIds:
          type: array
          minItems: 1
          maxItems: 60
          items: { type: string, format: uuid }

    DriverSummary:
      type: object
      description: Trips and credited kilometres per person in a season (DRV-09)
      required: [seasonId, seasonName, everyone, rows]
      properties:
        seasonId: { type: string, format: uuid }
        seasonName: { type: string, examples: [2026/27] }
        everyone:
          type: boolean
          description: 'Coach or admin: all drivers; otherwise only the caller'
        rows:
          type: array
          items: { $ref: '#/components/schemas/DriverSummaryRow' }

    DriverSummaryRow:
      type: object
      required: [person, trips, kilometres, tripsWithoutDistance]
      properties:
        person: { $ref: '#/components/schemas/PersonSummary' }
        trips: { type: integer, format: int32 }
        kilometres: { type: number, format: double }
        tripsWithoutDistance:
          type: integer
          format: int32
          description: Trips without known distance (no kilometres credited)

    RoutingPreset:
      type: object
      properties:
        routes:
          type: [array, 'null']
          description: Routes per pair of places (meeting point text, venue name; case is ignored)
          items: { $ref: '#/components/schemas/RoutingPair' }
        unavailable:
          type: [boolean, 'null']
          default: false
          description: Simulates an outage of the routing service (DRV-07)

    RoutingPair:
      type: object
      required: [from, to]
      properties:
        from: { type: string, examples: [Parkplatz Sporthalle Nord] }
        to: { type: string, examples: [Sporthalle Seefeld] }
        distanceKm:
          type: [number, 'null']
          format: double
          minimum: 0
          description: 'One-way distance; omitted: there is no route for this pair'
        durationMinutes: { type: [integer, 'null'], format: int32, minimum: 0 }

    Notification:
      type: object
      required: [id, type, recipient, text, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - REMINDER
            - LATE_CANCELLATION
            - CALL_UP_PUBLISHED
            - CALL_UP_CHANGED
            - CALLED_UP_PLAYER_DECLINED
            - MATCH_CHANGED
            - EVENT_CANCELLED
            - EVENT_RESCHEDULED
            - DRIVER_LIST_CHANGED
          description: Corresponds to BEN-01 to BEN-07 and DRV-11
        recipient: { $ref: '#/components/schemas/PersonSummary' }
        text: { type: string, examples: ['Anna Muster hat sich kurzfristig für Training Di 17.11. abgemeldet.'] }
        eventId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    NotificationChannel:
      type: string
      enum: [EMAIL, PUSH]
      description: Channel outside the app (F-19, BEN-10). The list in the app always exists.

    NotificationSettings:
      type: object
      description: The person's channels (F-19). The list in the app always exists.
      required: [email, emailAvailable, pushAvailable, devices]
      properties:
        email:
          type: boolean
          description: E-mails are on. Default on if the person has an e-mail address; always false without one.
        emailAddress:
          type: [string, 'null']
          description: Address the e-mails go to; null if the person has none
          examples: ['anna@example.ch']
        emailAvailable:
          type: boolean
          description: The server can send e-mails (configured, criterion 9)
        pushAvailable:
          type: boolean
          description: The server can send pushes (VAPID configured, criterion 9)
        pushPublicKey:
          type: [string, 'null']
          description: Public VAPID key (base64url) for `PushManager.subscribe`; null without push
        devices:
          type: array
          description: Devices with push, oldest first
          items: { $ref: '#/components/schemas/PushDevice' }

    NotificationSettingsInput:
      type: object
      required: [email]
      properties:
        email: { type: boolean }

    PushDevice:
      type: object
      description: A device with push (F-19). The browser compares `endpoint` with its own subscription.
      required: [id, endpoint, label, createdAt]
      properties:
        id: { type: string, format: uuid }
        endpoint: { type: string, description: Address at the push service of the browser }
        label: { type: string, examples: ['Chrome auf Android'] }
        createdAt: { type: string, format: date-time }

    PushSubscriptionInput:
      type: object
      description: '`PushSubscription.toJSON()` of the browser'
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 1000 }
        keys: { $ref: '#/components/schemas/PushSubscriptionKeys' }

    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh: { type: string, maxLength: 200, description: 'P-256 public key of the browser, base64url' }
        auth: { type: string, maxLength: 100, description: 'Authentication secret of the browser, base64url' }

    TestNotification:
      type: object
      description: A notification with its e-mails and pushes (test support, F-19). Fields of `Notification` plus `deliveries`.
      required: [id, type, recipient, text, createdAt, read, deliveries]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - REMINDER
            - LATE_CANCELLATION
            - CALL_UP_PUBLISHED
            - CALL_UP_CHANGED
            - CALLED_UP_PLAYER_DECLINED
            - MATCH_CHANGED
            - EVENT_CANCELLED
            - EVENT_RESCHEDULED
            - DRIVER_LIST_CHANGED
        recipient: { $ref: '#/components/schemas/PersonSummary' }
        text: { type: string }
        eventId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/TestDelivery' }

    TestDelivery:
      type: object
      description: One e-mail or push as it went out, or would have gone out in production
      required: [channel, address, subject, text, path, status, attempts]
      properties:
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        address: { type: string, description: E-mail address or push endpoint }
        subject: { type: string, examples: ['Abgesagt: Training Di 24.11.'] }
        text: { type: string }
        path: { type: string, description: 'Where the button or the tap leads, e.g. /termine/<id>' }
        status:
          type: string
          enum: [PENDING, SENT, FAILED, DISCARDED]
        attempts: { type: integer, format: int32 }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        sentAt: { type: [string, 'null'], format: date-time }
