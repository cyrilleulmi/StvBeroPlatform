openapi: 3.1.0
info:
  title: StvBeroPlatform API
  version: 0.1.0
  summary: REST-API des Kerns (Personen, Teams, Linien, Termine, An-/Abmeldung, Spieltage, Aufgebot).
  description: |
    Vertrag zwischen Frontend, Backend und Test-Agenten. **Contract first:** Änderungen an der API
    werden zuerst hier gemacht, dann umgesetzt. Konventionen: [README.md](README.md).

    Anforderungs-IDs (z.B. `ANM-04`) verweisen auf `docs/anforderungen/`.
    Endpunkte mit dem Tag `Test` existieren nur in den Quarkus-Profilen `dev` und `test`.
  license:
    name: Proprietär
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Lokal (Quarkus dev/test)
security:
  - session: []
tags:
  - name: Me
    description: Angemeldete Person, Kacheln
  - name: Seasons
    description: Saisons und Archiv (SAI)
  - name: Teams
    description: Teams und Teamzugehörigkeiten (PTF)
  - name: Lines
    description: Linien und Goalies (LIN)
  - name: Persons
    description: Personenverwaltung (Admin)
  - name: Events
    description: Termine, Serien (TER)
  - name: Responses
    description: An- und Abmeldung, Übersicht (ANM)
  - name: MatchDays
    description: Spiele und Aufgebot (AUF)
  - name: SwissUnihockey
    description: Anbindung swiss unihockey (SUH)
  - name: Notifications
    description: In-App-Benachrichtigungen (BEN)
  - name: Test
    description: Nur in den Profilen dev und test. Siehe docs/testbarkeit.md.

paths:
  # ---------------------------------------------------------------- Ich
  /api/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Angemeldete Person mit Teamzugehörigkeiten der aktuellen Saison
      description: |
        Ist keine Saison als aktuell festgelegt (SAI-03), antwortet die API mit 409, Titel «Keine
        aktuelle Saison», Regel SAI-03. Die Oberfläche zeigt dann einen Hinweis statt der Startseite.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/tiles:
    get:
      tags: [Me]
      operationId: listTiles
      summary: Kacheln, die die angemeldete Person sehen darf (NF-11, NF-12)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/session:
    get:
      tags: [Me]
      operationId: getSession
      summary: Ob eine gültige Sitzung besteht
      description: |
        Öffentlich und immer 200, damit die Oberfläche ohne Fehlerantwort prüfen kann, ob sie zur
        Anmeldung weiterleiten muss. Die Daten der Person liefert `GET /api/ich`.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /api/logout:
    post:
      tags: [Me]
      operationId: logout
      summary: Sitzung beenden und Sitzungs-Cookie löschen
      description: Auch ohne gültige Sitzung erfolgreich, damit das Abmelden immer funktioniert.
      security: []
      responses:
        '204':
          description: Abgemeldet
          headers:
            Set-Cookie:
              schema: { type: string }

  # ---------------------------------------------------------------- Saisons
  /api/seasons:
    get:
      tags: [Seasons]
      operationId: listSeasons
      summary: Alle Saisons, neueste zuerst
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Season' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Seasons]
      operationId: createSeason
      summary: Saison anlegen, optional mit Übernahme der Vorsaison (SAI-04, Admin)
      description: |
        Die neue Saison ist noch nicht aktuell. Mit `uebernehmenAus` werden die Teams und
        Teamzugehörigkeiten dieser Saison übernommen. Name schon vergeben oder Zeitraum überschneidet
        sich mit einer anderen Saison: 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSeason' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Season' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/seasons/{seasonId}/activate:
    parameters:
      - $ref: '#/components/parameters/seasonId'
    post:
      tags: [Seasons]
      operationId: activateSeason
      summary: Saison zur aktuellen Saison machen (SAI-03, SAI-06, Admin)
      responses:
        '204': { description: Aktiviert }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Teams
  /api/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Teams einer Saison. Ohne Admin-Rechte nur die eigenen.
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Team anlegen (Admin)
      description: Das Team gehört ab sofort zur angegebenen Saison. Archivierte Saisons sind nur lesbar (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Team mit Coaches und Spielerinnen nach Gruppe
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Teams]
      operationId: renameTeam
      summary: Team umbenennen (Admin)
      description: |
        Der Name gilt pro Saison. Umbenannt wird nur in der angegebenen Saison (Standard: aktuelle),
        alte Saisons behalten den damaligen Namen. Archivierte Saisons sind nur lesbar (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/teamId'
    post:
      tags: [Teams]
      operationId: addMember
      summary: Person mit Funktion ins Team aufnehmen (PTF-03, PTF-04, Admin)
      description: |
        Eine Person hat pro Team und Saison genau eine Funktion. Ist sie schon Mitglied, antwortet die
        API mit 409 (Regel PTF-04). Archivierte Saisons sind nur lesbar (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInput' }
      responses:
        '201':
          description: Aufgenommen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/members/{personId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
      - $ref: '#/components/parameters/personId'
    put:
      tags: [Teams]
      operationId: changeTeamRole
      summary: Funktion im Team ändern (Admin)
      description: |
        Wechselt eine Spielerin zur Coach, verliert sie ihre Linienzuweisung in diesem Team.
        Archivierte Saisons sind nur lesbar (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamRole]
              properties:
                teamRole: { $ref: '#/components/schemas/TeamRole' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Teams]
      operationId: removeMember
      summary: Person aus dem Team entfernen (Admin). Bisherige Antworten bleiben erhalten.
      description: Archivierte Saisons sind nur lesbar (409, SAI-02).
      parameters:
        - $ref: '#/components/parameters/season'
      responses:
        '204': { description: Entfernt }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Linien
  /api/teams/{teamId}/groups:
    parameters:
      - $ref: '#/components/parameters/teamId'
    get:
      tags: [Lines]
      operationId: getLineup
      summary: Linien und Goalies eines Teams mit Spielerinnen, plus «Ohne Linie»
      description: Aktuelle Saison. Für Mitglieder des Teams (jede Funktion) und Admins, sonst 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lineup' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Lines]
      operationId: createLine
      summary: Linie anlegen (LIN-07, Coach). Goalies gibt es pro Team automatisch genau einmal.
      description: |
        Gilt für die aktuelle Saison (LIN-11). Ohne `reihenfolge` kommt die Linie ans Ende, sonst an
        diese Position (die übrigen rücken nach). Namen sind pro Team eindeutig, sonst 409 (LIN-09).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
      - $ref: '#/components/parameters/groupId'
    put:
      tags: [Lines]
      operationId: updateLine
      summary: Linie umbenennen oder Reihenfolge ändern (Coach)
      description: |
        Mit `reihenfolge` rückt die Linie an diese Position, die übrigen werden neu nummeriert (1, 2, …).
        Goalies lassen sich weder umbenennen noch verschieben (409, LIN-05).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Lines]
      operationId: deleteLine
      summary: Linie löschen (Coach). Ihre Spielerinnen sind danach «ohne Linie». Goalies lassen sich nicht löschen (409).
      responses:
        '204': { description: Gelöscht }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/assignments/{personId}:
    parameters:
      - $ref: '#/components/parameters/teamId'
      - $ref: '#/components/parameters/personId'
    put:
      tags: [Lines]
      operationId: setAssignment
      summary: Spielerin einer Gruppe zuweisen oder auf «ohne Linie» setzen (LIN-02, LIN-07, LIN-10)
      description: |
        Ersetzt eine bestehende Zuweisung im selben Team (höchstens eine Gruppe pro Team).
        Nur Personen mit Funktion `PLAYER` in diesem Team, sonst 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId:
                  type: [string, 'null']
                  format: uuid
                  description: '`null` = ohne Linie'
      responses:
        '204': { description: Gesetzt }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Personen
  /api/persons:
    get:
      tags: [Persons]
      operationId: listPersons
      summary: Alle Personen (Admin)
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Teil von Vor- oder Nachname
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Person' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Persons]
      operationId: createPerson
      summary: Person anlegen (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/persons/{personId}:
    parameters:
      - $ref: '#/components/parameters/personId'
    get:
      tags: [Persons]
      operationId: getPerson
      summary: Person mit allen Teamzugehörigkeiten (Admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Persons]
      operationId: updatePerson
      summary: Person ändern (Admin)
      description: Der letzten Person mit Admin-Rechten kann das Recht nicht entzogen werden (409, RR-04).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Termine
  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: Termine der eigenen Teams mit eigener Antwort (TER-13)
      parameters:
        - name: from
          in: query
          description: Standard ist «jetzt» (Backend-Uhr)
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: team
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/EventType' }
        - name: view
          in: query
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
      responses:
        '200':
          description: Chronologisch sortiert (vergangene absteigend)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Einzeltermin, Spieltag oder Anlass erfassen (TER-11, AUF-16, Coach)
      description: |
        Die Person muss Admin oder Coach in mindestens einem der angegebenen Teams sein (TER-01, RR-06), sonst 403.
        Ein Spieltag hat genau ein Team (AUF-03). Ein Termin in der Vergangenheit ergibt 400, einer in einer
        Saison im Archiv 409 (SAI-02). Ohne `antwortfristStunden` gelten 24 Stunden (TER-10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Termin mit eigener Antwort, bei Spieltag mit Spielen, Treffpunkt und eigenem Aufgebotsstatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      operationId: updateEvent
      summary: Termin ändern oder verschieben (TER-06, TER-12, Coach)
      description: |
        Eine geänderte Beginnzeit gilt als Verschiebung (`verschoben`) und benachrichtigt alle Mitglieder der beteiligten Teams (BEN-07).
        Antworten bleiben erhalten. Bei einem Serientermin gilt die Änderung nur für diesen Termin; spätere
        Änderungen der Serie übernimmt er nicht mehr (TER-06). Abgesagte oder vergangene Termine: 409.
        Spieltag auf einen anderen Tag: von Hand erfasste Spiele ziehen mit. Hat er Spiele aus swiss unihockey,
        lässt er sich nur am selben Tag verschieben (422 beim Feld `beginn`, Regel SUH-05, Annahme O-48).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Termin absagen (TER-06, TER-12, Coach). Danach sind keine Antworten mehr möglich.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, examples: [Halle besetzt] }
      responses:
        '200':
          description: Abgesagt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/series:
    post:
      tags: [Events]
      operationId: createSeries
      summary: Serie anlegen, erzeugt die Termine im Gültigkeitszeitraum (TER-05, Coach)
      description: |
        Erzeugt einen Termin für jeden Wochentag im Gültigkeitszeitraum, der noch nicht begonnen hat. Rechte wie bei
        `terminAnlegen`. Der Zeitraum dauert höchstens ein Jahr (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/seriesId'
    get:
      tags: [Events]
      operationId: getSeries
      summary: Serie mit Ausnahmen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      operationId: updateSeries
      summary: Serie ändern. Gilt für künftige Termine, gegebene Antworten bleiben (TER-08, Coach).
      description: |
        Künftige Termine übernehmen die neuen Angaben. Einzeln geänderte und abgesagte Termine bleiben unverändert.
        Termine, die nicht mehr zur Serie passen, werden entfernt bzw. abgesagt («Serie geändert»), wenn schon
        jemand geantwortet hat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/series/{seriesId}/exceptions:
    parameters:
      - $ref: '#/components/parameters/seriesId'
    post:
      tags: [Events]
      operationId: createSeriesException
      summary: Zeitraum von der Serie ausnehmen, z.B. Ferien (TER-07, Coach)
      description: |
        Künftige geplante Termine der Serie im Zeitraum werden entfernt. Hat schon jemand geantwortet, wird der
        Termin stattdessen abgesagt, Grund = Grund der Ausnahme (O-19).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeriesException' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Antworten
  /api/events/{eventId}/overview:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [Responses]
      operationId: getOverview
      summary: Antworten nach Team und Gruppe, Coach-Block, Zähler (ANM-20 bis ANM-32)
      description: |
        Kommentare sind nur enthalten, wenn die anfragende Person Coach im jeweiligen Team ist
        oder es um ihre eigene Antwort geht (ANM-07). Leere Gruppen fehlen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/events/{eventId}/responses/me:
    parameters:
      - $ref: '#/components/parameters/eventId'
    put:
      tags: [Responses]
      operationId: setOwnResponse
      summary: Eigene Antwort setzen oder ändern (ANM-01 bis ANM-10)
      description: |
        Nur Mitglieder eines beteiligten Teams (jede Funktion), sonst 403. `MAYBE` verlangt einen
        Kommentar (sonst 422, Feld `kommentar`). Ein Wechsel von `ATTENDING` weg nach der Antwortfrist ist eine
        kurzfristige Absage (`kurzfristig`) und benachrichtigt die Coaches (ANM-10, BEN-02). Die Markierung
        bleibt bis zum nächsten «dabei». Bei abgesagten und vergangenen Terminen 409 (TER-06).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseInput' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Response' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/events/{eventId}/responses/{personId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/personId'
    put:
      tags: [Responses]
      operationId: setResponseOnBehalf
      summary: Antwort stellvertretend setzen (ANM-11, ANM-12, RR-06)
      description: |
        Nur Coaches eines Teams, in dem die Person beim Termin Spielerin ist, und Admins (für jedes Mitglied
        eines beteiligten Teams). Sonst 403. Gehört die Person zu keinem beteiligten Team, 404. Es gelten
        dieselben Regeln wie bei der eigenen Antwort; `eingetragenVon` ist die anfragende Person (ANM-12).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseInput' }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Response' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ---------------------------------------------------------------- Spieltage
  /api/events/{eventId}/matches:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [MatchDays]
      operationId: addMatch
      summary: Spiel zu einem Spieltag hinzufügen (AUF-14, Coach)
      description: |
        Nur bei Spieltagen (sonst 409, Regel AUF-01), solange der Spieltag weder abgesagt noch vorbei ist (409, TER-06).
        Die Anspielzeit liegt am Tag des Spieltags (sonst 400 beim Feld `anspielzeit`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchInput' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/matchId'
    put:
      tags: [MatchDays]
      operationId: updateMatch
      summary: Spiel ändern, z.B. Resultat erfassen (AUF-15, Coach). Importierte Felder sind schreibgeschützt (409).
      description: |
        Das Resultat (Heim:Gast) lässt sich auch nach dem Spieltag erfassen; nur ein abgesagter Spieltag ergibt 409 (TER-06).
        Bei Spielen aus swiss unihockey sind Gegner, Anspielzeit und Heim/Auswärts schreibgeschützt (409, Regel SUH-06).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchInput' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [MatchDays]
      operationId: deleteMatch
      summary: Von Hand erfasstes Spiel löschen (Coach)
      description: |
        Spiele aus swiss unihockey nur, wenn swiss unihockey sie nicht mehr liefert (sonst 409, Regel SUH-06).
        Abgesagte oder vergangene Spieltage: 409 (TER-06).
      responses:
        '204': { description: Gelöscht }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/events/{eventId}/call-up:
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      tags: [MatchDays]
      operationId: getCallUp
      summary: Aufgebot mit allen Spielerinnen des Teams, gruppiert, mit Antwortstatus (AUF-21, AUF-22, Coach)
      description: |
        Nur Coaches des Teams und Admins (sonst 403). Kein Spieltag: 409 (Regel AUF-02). Coaches stehen nicht in der
        Auswahl (AUF-28). Gruppen wie in der Übersicht, leere Gruppen fehlen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [MatchDays]
      operationId: setCallUp
      summary: Auswahl speichern (Coach). Ist das Aufgebot veröffentlicht, werden Betroffene benachrichtigt (AUF-27).
      description: |
        Ersetzt die ganze Auswahl. Jede Spielerin des Teams lässt sich aufbieten, unabhängig von ihrer Antwort (AUF-22).
        Coaches oder Personen ausserhalb des Teams: 422 (Regel AUF-28). Kein Spieltag, abgesagt oder vorbei: 409.
        Ein veröffentlichtes Aufgebot bleibt veröffentlicht. Wer neu dazukommt oder herausfällt, wird benachrichtigt (BEN-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personIds]
              properties:
                personIds:
                  type: array
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallUp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /api/events/{eventId}/call-up/publish:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      tags: [MatchDays]
      operationId: publishCallUp
      summary: Aufgebot veröffentlichen und alle Spielerinnen des Teams benachrichtigen (AUF-23, AUF-24, Coach)
      description: |
        Nur ein Entwurf mit mindestens einer Spielerin (sonst 409, Regel AUF-23), nur einmal. Danach sehen die
        Spielerinnen `meinAufgebot`. Sie werden benachrichtigt (BEN-03).
      responses:
        '200':
          description: Veröffentlicht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallUp' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- swiss unihockey
  /api/teams/{teamId}/swiss-unihockey:
    parameters:
      - $ref: '#/components/parameters/teamId'
    put:
      tags: [SwissUnihockey]
      operationId: linkSu
      summary: Team mit swiss unihockey verknüpfen oder Verknüpfung lösen (SUH-02, Admin)
      description: |
        Die Team-ID findet man auf swissunihockey.ch in der Adresse der Team-Seite. Eine Team-ID gehört zu
        höchstens einem Team (sonst 409). Das Lösen lässt bereits importierte Spieltage unverändert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suTeamId]
              properties:
                suTeamId:
                  type: [integer, 'null']
                  description: '`null` löst die Verknüpfung'
                  minimum: 1
                  examples: [900001]
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{teamId}/swiss-unihockey/sync:
    parameters:
      - $ref: '#/components/parameters/teamId'
    post:
      tags: [SwissUnihockey]
      operationId: syncSu
      summary: Abgleich sofort ausführen statt auf den täglichen Lauf zu warten (SUH-03, Admin)
      description: |
        Gleicht die Spiele des Teams in der aktuellen Saison ab. Spiele am selben Tag in derselben Halle werden
        ein Spieltag (SUH-04). Geänderte Spiele werden übernommen, Treffpunkt, Hinweise, Antworten und Aufgebot
        bleiben (SUH-05, SUH-06), alle Mitglieder des Teams werden benachrichtigt (BEN-06). Spiele, die swiss
        unihockey nicht mehr liefert, werden markiert, nicht gelöscht. Von Hand erfasste Spieltage bleiben
        unberührt (SUH-10). 409, wenn das Team nicht verknüpft ist oder nicht zur aktuellen Saison gehört.
        502, wenn swiss unihockey nicht erreichbar ist oder Unerwartetes liefert: Dann ändert sich nichts (SUH-09).
        Derselbe Abgleich läuft täglich für alle verknüpften Teams.
      responses:
        '200':
          description: Ergebnis des Abgleichs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: swiss unihockey nicht erreichbar oder unerwartete Antwort (SUH-09)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------- Benachrichtigungen
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Eigene Benachrichtigungen, neueste zuerst (BEN-12)
      description: |
        Nur die eigenen. `ungelesen=true` liefert nur ungelesene (Zähler in der Navigation).
        Benachrichtigt wird bei: Erinnerung 12 Stunden vor der Antwortfrist an alle ohne Antwort, einmal pro
        Person und Termin (BEN-01, BEN-13); kurzfristiger Absage an die Coaches der Teams, in denen die Person
        Spielerin ist (BEN-02, O-17); Abmeldung einer Aufgebotenen an dieselben Coaches (BEN-04);
        Veröffentlichung an alle Spielerinnen des Teams (BEN-03); Änderung eines veröffentlichten Aufgebots an
        neu Aufgebotene und nicht mehr Aufgebotene (BEN-05); Absage und Verschiebung an alle Mitglieder der
        beteiligten Teams (BEN-07). Wer etwas auslöst, wird darüber nicht benachrichtigt.
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Als gelesen markieren
      description: |
        Mehrfach markieren ändert nichts (204). Die Benachrichtigung einer anderen Person: 403 (RR-07).
      responses:
        '204': { description: Markiert }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Test
  /api/test/reset:
    post:
      tags: [Test]
      operationId: testReset
      summary: Datenbank auf den Seed zurücksetzen, Uhr auf Standard, Simulator zurücksetzen
      description: Seed siehe docs/testdaten.md. Nur Profile dev und test.
      security: []
      responses:
        '204': { description: Zurückgesetzt }
  /api/test/clock:
    put:
      tags: [Test]
      operationId: testSetClock
      summary: Backend-Uhr auf einen festen Zeitpunkt setzen. Löst fällige Jobs (Erinnerungen) sofort aus.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [now]
              properties:
                now:
                  type: string
                  format: date-time
                  examples: ['2026-11-16T19:00:00+01:00']
      responses:
        '204': { description: Gesetzt }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Test]
      operationId: testGetClock
      summary: Aktuelle Backend-Zeit
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [now, fixed]
                properties:
                  now: { type: string, format: date-time }
                  fixed: { type: boolean }
    delete:
      tags: [Test]
      operationId: testReleaseClock
      summary: Wieder die echte Zeit verwenden
      security: []
      responses:
        '204': { description: Gelöst }
  /api/test/current-season:
    delete:
      tags: [Test]
      operationId: testRemoveCurrentSeason
      summary: Keine Saison mehr als aktuell markieren (Zustand «keine aktuelle Saison»). Reset stellt den Seed wieder her.
      security: []
      responses:
        '204': { description: Entfernt }
  /api/test/login:
    post:
      tags: [Test]
      operationId: testLogin
      summary: Ohne Passwort als Seed-Person anmelden. Setzt das Sitzungs-Cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginKey]
              properties:
                loginKey:
                  type: string
                  description: Schlüssel aus docs/testdaten.md
                  examples: [petra]
      responses:
        '204':
          description: Angemeldet
          headers:
            Set-Cookie:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/test/persons:
    get:
      tags: [Test]
      operationId: testListPersons
      summary: Personen mit Schlüssel für die Testmodus-Anmeldung (/dev-login)
      security: []
      responses:
        '200':
          description: Nach Nachname, dann Vorname
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestPerson' }
  /api/test/notifications:
    get:
      tags: [Test]
      operationId: testListNotifications
      summary: Alle Benachrichtigungen aller Personen seit dem letzten Reset, inklusive Seed
      security: []
      responses:
        '200':
          description: Chronologisch
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /api/test/swiss-unihockey/matches:
    put:
      tags: [Test]
      operationId: testSetSuMatches
      summary: Daten vorgeben, die der Simulator für eine swiss-unihockey-Team-ID liefert
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suTeamId, matches]
              properties:
                suTeamId: { type: integer, examples: [900001] }
                unavailable:
                  type: boolean
                  default: false
                  description: Simuliert einen Ausfall (SUH-09)
                matches:
                  type: array
                  items: { $ref: '#/components/schemas/SuMatch' }
      responses:
        '204': { description: Gesetzt }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: stv_session
      description: Sitzungs-Cookie. Das produktive Anmeldeverfahren ist offen (O-01).

  parameters:
    season:
      name: season
      in: query
      description: Saison-ID. Standard ist die aktuelle Saison.
      schema: { type: string, format: uuid }
    seasonId:
      name: seasonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    teamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    personId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    eventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    seriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, format: uuid }
    matchId:
      name: matchId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Nicht angemeldet
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Keine Berechtigung (RR-07)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Nicht gefunden
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Anfrage formal ungültig
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Widerspricht dem aktuellen Zustand (z.B. Termin abgesagt, schon Mitglied)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RuleViolation:
      description: Fachliche Regel verletzt (z.B. «vielleicht» ohne Kommentar)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details. `detail` ist ein deutscher Text, der direkt angezeigt werden kann.
      required: [status, title]
      properties:
        type: { type: string, format: uri, examples: ['urn:stv:fehler:kommentar-pflicht'] }
        title: { type: string, examples: [Kommentar fehlt] }
        status: { type: integer, examples: [422] }
        detail: { type: string, examples: ['Bei «vielleicht» ist ein Kommentar Pflicht.'] }
        rule: { type: string, description: Verletzte Anforderung, examples: [ANM-04] }
        fields:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, examples: [kommentar] }
              message: { type: string }

    TeamRole:
      type: string
      enum: [PLAYER, COACH]
      description: Erweiterbar (PTF-06). Clients behandeln unbekannte Werte wie ein Mitglied ohne Sonderrechte.
    EventType:
      type: string
      enum: [PRACTICE, MATCH_DAY, OTHER]
    EventStatus:
      type: string
      enum: [PLANNED, CANCELLED]
      description: Ob ein Termin vorbei ist, ergibt sich aus `end` und der Backend-Uhr.
    ResponseStatus:
      type: string
      enum: [PENDING, ATTENDING, DECLINED, MAYBE]
    GroupType:
      type: string
      enum: [LINE, GOALIES]
    CallUpStatus:
      type: string
      enum: [NONE, DRAFT, PUBLISHED]
    MyCallUp:
      type: string
      enum: [NO_CALL_UP_YET, CALLED_UP, NOT_CALLED_UP]
    MatchSource:
      type: string
      enum: [MANUAL, SWISS_UNIHOCKEY]

    PersonSummary:
      type: object
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, examples: [Anna] }
        lastName: { type: string, examples: [Muster] }
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          required: [admin]
          properties:
            email: { type: [string, 'null'], format: email }
            admin: { type: boolean }
    PersonInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: [string, 'null'], format: email }
        admin: { type: boolean, default: false }
    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required: [memberships]
          properties:
            memberships:
              type: array
              items: { $ref: '#/components/schemas/TeamMembership' }
    Me:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required: [season, memberships, now]
          properties:
            season: { $ref: '#/components/schemas/Season' }
            memberships:
              type: array
              items: { $ref: '#/components/schemas/TeamMembership' }
            now:
              type: string
              format: date-time
              description: Zeitpunkt der Backend-Uhr beim Laden, z.B. für «Jahr nur anzeigen, wenn nicht das aktuelle» (F-03)
    Session:
      type: object
      required: [signedIn]
      properties:
        signedIn: { type: boolean }
    Tile:
      type: object
      required: [id, title, icon, route, color]
      properties:
        id: { type: string, examples: [anwesenheit] }
        title: { type: string, examples: [Anwesenheit] }
        icon: { type: string, description: Lucide-Icon-Name, examples: [calendar-check] }
        route: { type: string, examples: [/termine] }
        color:
          type: string
          enum: [primary, blue, mustard, coral]
        hint: { type: [string, 'null'], description: 'Kurzer Status, z.B. «2 offen»' }

    TestPerson:
      type: object
      description: Seed-Person mit Schlüssel aus docs/testdaten.md. Nur Profile dev und test.
      required: [loginKey, id, firstName, lastName, admin]
      properties:
        loginKey: { type: string, examples: [petra] }
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        admin: { type: boolean }

    Season:
      type: object
      required: [id, name, startDate, endDate, current, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [2026/27] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        current: { type: boolean }
        archived:
          type: boolean
          description: Saison vor der aktuellen. Nur lesbar (SAI-02).
    NewSeason:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 20, examples: [2027/28] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        copyFrom:
          type: [string, 'null']
          format: uuid
          description: Saison, deren Teams, Zugehörigkeiten und Linien übernommen werden (SAI-04)

    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [Team 1] }
        suTeamId: { type: [integer, 'null'], examples: [900001] }
        myTeamRole:
          oneOf:
            - $ref: '#/components/schemas/TeamRole'
            - type: 'null'
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    TeamDetail:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          required: [coaches, lineup]
          properties:
            coaches:
              type: array
              items: { $ref: '#/components/schemas/PersonSummary' }
            lineup: { $ref: '#/components/schemas/Lineup' }
    TeamMembership:
      type: object
      required: [team, person, teamRole, seasonId]
      properties:
        team:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        person: { $ref: '#/components/schemas/PersonSummary' }
        teamRole: { $ref: '#/components/schemas/TeamRole' }
        seasonId: { type: string, format: uuid }
        groupId:
          type: [string, 'null']
          format: uuid
          description: Nur bei Funktion PLAYER
    MemberInput:
      type: object
      required: [personId, teamRole]
      properties:
        personId: { type: string, format: uuid }
        teamRole: { $ref: '#/components/schemas/TeamRole' }

    Group:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/GroupType' }
        name: { type: string, examples: [Linie 1] }
        sortOrder: { type: [integer, 'null'], description: Nur bei LINE }
    LineInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        sortOrder: { type: integer, minimum: 1 }
    Lineup:
      type: object
      description: Alle Gruppen eines Teams in Anzeigereihenfolge, auch leere
      required: [groups, noLine]
      properties:
        groups:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Group'
              - type: object
                required: [players]
                properties:
                  players:
                    type: array
                    items: { $ref: '#/components/schemas/PersonSummary' }
        noLine:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }

    Location:
      type: object
      required: [name]
      properties:
        name: { type: string, examples: [Sporthalle Seefeld, Musterdorf] }
        address: { type: [string, 'null'] }
        mapsUrl:
          type: [string, 'null']
          format: uri
          description: Google-Maps-Link (AUF-10). Muss mit https:// beginnen.
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    MeetingPoint:
      type: object
      required: [time, location]
      properties:
        time: { type: string, format: date-time }
        location: { type: string, examples: [Parkplatz Sporthalle Nord] }
    Counts:
      type: object
      required: [attending, declined, maybe, pending]
      properties:
        attending: { type: integer, minimum: 0 }
        declined: { type: integer, minimum: 0 }
        maybe: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }

    EventSummary:
      type: object
      required: [id, type, title, start, end, status, teams, responseDeadline, myResponse]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EventType' }
        title: { type: string, examples: [Training] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EventStatus' }
        cancellationReason: { type: [string, 'null'] }
        rescheduled: { type: boolean, default: false }
        teams:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Team' }
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        responseDeadline: { type: string, format: date-time }
        myResponse: { $ref: '#/components/schemas/Response' }
        counts:
          $ref: '#/components/schemas/Counts'
          description: Gesamtzähler Spielerinnen
        seriesId: { type: [string, 'null'], format: uuid }
    Event:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            notes: { type: [string, 'null'], examples: [Weisse Trikots mitnehmen] }
            responseDeadlineHours: { type: integer, minimum: 0 }
            meetingPoint:
              oneOf:
                - $ref: '#/components/schemas/MeetingPoint'
                - type: 'null'
            matches:
              type: array
              description: Nur bei MATCH_DAY, nach Anspielzeit sortiert
              items: { $ref: '#/components/schemas/Match' }
            callUpStatus:
              $ref: '#/components/schemas/CallUpStatus'
              description: Nur bei MATCH_DAY. Wer nicht Coach des Teams oder Admin ist, sieht vor der Veröffentlichung NONE (AUF-23).
            myCallUp:
              oneOf:
                - $ref: '#/components/schemas/MyCallUp'
                - type: 'null'
              description: Nur bei MATCH_DAY und Funktion PLAYER
            canEdit: { type: boolean, description: Für die Anzeige von Coach-Aktionen }
    EventInput:
      type: object
      required: [type, title, start, end, teamIds]
      properties:
        type: { $ref: '#/components/schemas/EventType' }
        title: { type: string, minLength: 1, maxLength: 80 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        teamIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 500 }
        responseDeadlineHours: { type: integer, minimum: 0, maximum: 336, default: 24, description: 'Stunden vor Beginn (TER-09, TER-10)' }
        meetingPoint:
          oneOf:
            - $ref: '#/components/schemas/MeetingPoint'
            - type: 'null'

    Series:
      allOf:
        - $ref: '#/components/schemas/SeriesInput'
        - type: object
          required: [id, teams, exceptions]
          properties:
            id: { type: string, format: uuid }
            teams:
              type: array
              minItems: 1
              description: Alle Teams der Serie nach Name, mit dem Namen in der Saison der Serie (TER-11)
              items: { $ref: '#/components/schemas/Team' }
            exceptions:
              type: array
              items: { $ref: '#/components/schemas/SeriesException' }
    SeriesInput:
      type: object
      required: [type, title, teamIds, weekday, startTime, endTime, validFrom, validUntil]
      properties:
        type:
          type: string
          enum: [PRACTICE, OTHER]
        title: { type: string, minLength: 1, maxLength: 80, examples: [Training] }
        teamIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        weekday:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['18:30'] }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['20:00'] }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }
        location:
          oneOf:
            - $ref: '#/components/schemas/Location'
            - type: 'null'
        responseDeadlineHours: { type: integer, minimum: 0, maximum: 336, default: 24, description: 'Stunden vor Beginn (TER-09, TER-10)' }
    SeriesException:
      type: object
      required: [startDate, endDate, reason]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 200, examples: [Weihnachtsferien] }

    Response:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ResponseStatus' }
        comment:
          type: [string, 'null']
          description: Nur für die Person selbst und Coaches des Teams sichtbar (ANM-07), sonst nicht enthalten
        changedAt: { type: [string, 'null'], format: date-time }
        enteredBy:
          oneOf:
            - $ref: '#/components/schemas/PersonSummary'
            - type: 'null'
          description: Gesetzt, wenn stellvertretend eingetragen (ANM-12)
        lateCancellation:
          type: boolean
          default: false
          description: Abgesagt oder auf «vielleicht» nach der Antwortfrist (ANM-10)
    ResponseInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ATTENDING, DECLINED, MAYBE]
        comment:
          type: [string, 'null']
          maxLength: 200
          description: Pflicht bei MAYBE (ANM-04), freiwillig bei DECLINED (ANM-05)

    Overview:
      type: object
      required: [eventId, total, teams, coaches]
      properties:
        eventId: { type: string, format: uuid }
        total:
          $ref: '#/components/schemas/Counts'
          description: Jede Spielerin einmal, auch wenn sie in mehreren Teams ist (ANM-32)
        teams:
          type: array
          description: Nach Teamname sortiert
          items: { $ref: '#/components/schemas/OverviewTeam' }
        coaches:
          type: array
          description: Coach-Block (ANM-22)
          items:
            type: object
            required: [person, team, response]
            properties:
              person: { $ref: '#/components/schemas/PersonSummary' }
              team:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
              response: { $ref: '#/components/schemas/Response' }
    OverviewTeam:
      type: object
      required: [team, counts, groups]
      properties:
        team:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        counts: { $ref: '#/components/schemas/Counts' }
        groups:
          type: array
          description: Linien nach Reihenfolge, dann Goalies, dann «Ohne Linie». Leere Gruppen fehlen.
          items:
            type: object
            required: [type, name, entries]
            properties:
              groupId:
                type: [string, 'null']
                format: uuid
                description: '`null` bei «Ohne Linie»'
              type:
                type: string
                enum: [LINE, GOALIES, NO_LINE]
              name: { type: string, examples: [Linie 1, Goalies, Ohne Linie] }
              entries:
                type: array
                description: Nach Nachname, dann Vorname
                items:
                  type: object
                  required: [person, response]
                  properties:
                    person: { $ref: '#/components/schemas/PersonSummary' }
                    response: { $ref: '#/components/schemas/Response' }

    Match:
      type: object
      required: [id, opponent, startTime, home, source]
      properties:
        id: { type: string, format: uuid }
        opponent: { type: string, examples: [UHC Musterdorf] }
        startTime: { type: string, format: date-time }
        home: { type: boolean }
        result: { type: [string, 'null'], pattern: '^\d{1,2}:\d{1,2}$', examples: ['5:3'] }
        source: { $ref: '#/components/schemas/MatchSource' }
        suMatchId: { type: [integer, 'null'] }
        missingAtSu:
          type: boolean
          default: false
          description: swiss unihockey liefert das Spiel nicht mehr. Wird nicht automatisch gelöscht.
    MatchInput:
      type: object
      required: [opponent, startTime, home]
      properties:
        opponent: { type: string, minLength: 1, maxLength: 80 }
        startTime: { type: string, format: date-time }
        home: { type: boolean }
        result: { type: [string, 'null'], pattern: '^\d{1,2}:\d{1,2}$' }

    CallUp:
      type: object
      required: [eventId, status, groups]
      properties:
        eventId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CallUpStatus' }
        publishedAt: { type: [string, 'null'], format: date-time }
        calledUpCount: { type: integer, minimum: 0 }
        groups:
          type: array
          description: Alle Spielerinnen des Teams, gruppiert wie in der Übersicht, auch ohne Antwort (AUF-21, AUF-22)
          items:
            type: object
            required: [type, name, entries]
            properties:
              groupId: { type: [string, 'null'], format: uuid }
              type:
                type: string
                enum: [LINE, GOALIES, NO_LINE]
              name: { type: string }
              entries:
                type: array
                items:
                  type: object
                  required: [person, response, calledUp]
                  properties:
                    person: { $ref: '#/components/schemas/PersonSummary' }
                    response: { $ref: '#/components/schemas/Response' }
                    calledUp: { type: boolean }

    SyncResult:
      type: object
      required: [created, changed, missing, unchanged]
      properties:
        created: { type: integer, description: Neu angelegte Spiele }
        changed: { type: integer }
        missing: { type: integer }
        unchanged: { type: integer }
        affectedEvents:
          type: array
          items: { type: string, format: uuid }
    SuMatch:
      type: object
      description: Vereinfachte Form eines Spiels, wie sie der Simulator liefert
      required: [suMatchId, startTime, homeTeam, awayTeam, hall]
      properties:
        suMatchId: { type: integer, examples: [5000002] }
        startTime: { type: string, format: date-time }
        homeTeam: { type: string }
        awayTeam: { type: string }
        hall: { type: string, examples: [Sporthalle Seefeld] }
        location: { type: [string, 'null'], examples: [Musterdorf] }
        mapsUrl: { type: [string, 'null'], format: uri }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        result: { type: [string, 'null'] }

    Notification:
      type: object
      required: [id, type, recipient, text, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - REMINDER
            - LATE_CANCELLATION
            - CALL_UP_PUBLISHED
            - CALL_UP_CHANGED
            - CALLED_UP_PLAYER_DECLINED
            - MATCH_CHANGED
            - EVENT_CANCELLED
            - EVENT_RESCHEDULED
          description: Entspricht BEN-01 bis BEN-07
        recipient: { $ref: '#/components/schemas/PersonSummary' }
        text: { type: string, examples: ['Anna Muster hat sich kurzfristig für Training Di 17.11. abgemeldet.'] }
        eventId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
